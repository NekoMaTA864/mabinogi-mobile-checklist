<head>

  <style>
    :root { --navy:#102d45; --blue:#1e5d8f; --ice:#e6f2fb; --paper:#f6f9fc; --ink:#183145; --muted:#607487; --line:#d7e3ed; --mint:#e9f6ef; --mint-ink:#176043; --amber:#fff4d7; --amber-ink:#815400; }

    body { margin:0; background:linear-gradient(150deg,#eaf3f9 0%,#f7fafc 43%,#e7f0f6 100%); color:var(--ink); font:16px/1.45 system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif; min-height:100vh; }
    button,input { font:inherit; }

    .meter b { font-size:.9rem; } .meter span { color:var(--muted); font-size:.83rem; }
    .track { grid-column:1/-1; height:7px; background:#e3edf4; overflow:hidden; border-radius:99px; } .fill { height:100%; background:linear-gradient(90deg,#2170a8,#4a9ccd); border-radius:99px; transition:width .2s; }
    .tabs { display:grid; grid-template-columns:repeat(5,1fr); gap:.36rem; padding:.34rem; background:#e5edf3; border-radius:12px; margin-bottom:1rem; }

    .task:last-child { border-bottom:0; } .task.done .task-name { color:#8294a2; text-decoration:line-through; }
    .task input[type=checkbox] { appearance:none; width:1.2rem; height:1.2rem; border:2px solid #8fa8ba; border-radius:5px; display:grid; place-content:center; cursor:pointer; margin:0; }
    .task input[type=checkbox]::before { content:""; width:.55rem; height:.3rem; border-left:2px solid white; border-bottom:2px solid white; transform:rotate(-45deg) scale(0); margin-top:-.13rem; } .task input:checked { background:#2170a8; border-color:#2170a8; } .task input:checked::before { transform:rotate(-45deg) scale(1); }
    .task-name { font-weight:650; font-size:.94rem; } .task-note { color:var(--muted); font-size:.76rem; margin-top:.08rem; }
    .pill { background:#eef5fa; color:#47677d; font-size:.73rem; padding:.22rem .45rem; border-radius:99px; white-space:nowrap; }
    .week { display:grid; grid-template-columns:1fr auto; gap:.5rem .8rem; padding:.78rem .8rem; border-bottom:1px solid #e8eff4; align-items:center; } .week:last-child { border:0; }
    .week-name { font-weight:650; font-size:.94rem; } .week small { color:var(--muted); }
    .stepper { display:flex; align-items:center; border:1px solid #cbdbe6; border-radius:9px; overflow:hidden; background:white; } .stepper button { border:0; background:#eef5fa; color:#245675; min-width:2rem; min-height:2rem; cursor:pointer; font-weight:800; } .stepper output { min-width:2.45rem; text-align:center; font-weight:750; font-size:.9rem; }
    .week progress { grid-column:1/-1; width:100%; height:7px; accent-color:#2c82b9; } .week.complete { background:var(--mint); } .week.complete .week-name { color:var(--mint-ink); }
    .task-group { margin-bottom:.75rem; }
    .task-group:last-child { margin-bottom:0; }

    .task-group summary::-webkit-details-marker { display:none; }

    .task-group:not([open]) summary { border-radius:12px; }
    .task-group:not([open]) summary::after { transform:rotate(-90deg); }

    .exchange-intro h3, .exchange-empty h3 { margin:0 0 .3rem; font-size:.98rem; }

    .exchange-fields { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.5rem; margin-top:.8rem; }
    .exchange-field { padding:.55rem .65rem; border:1px dashed #b8cddc; border-radius:9px; color:#486476; font-size:.8rem; }
    .exchange-field b { display:block; color:#31566d; margin-bottom:.08rem; }
    .exchange-empty { text-align:center; }
    .exchange-empty p + p { margin-top:.65rem; }
    .warehouse { display:grid; grid-template-columns:auto 1fr; gap:.75rem; align-items:start; padding:1rem; background:white; border:1px solid var(--line); border-radius:14px; } .warehouse-icon { width:2.4rem; height:2.4rem; display:grid; place-items:center; border-radius:10px; background:#edf4f8; font-size:1.25rem; } .warehouse h2 { margin:0; font-size:1rem; } .warehouse p { margin:.25rem 0 0; color:#486476; font-size:.87rem; } .warehouse .rule { grid-column:1/-1; border-radius:9px; padding:.65rem .72rem; background:var(--amber); color:var(--amber-ink); font-size:.82rem; }
    .warehouse-list { margin-top:.8rem; background:white; border:1px solid var(--line); border-radius:14px; overflow:hidden; } .warehouse-list div { padding:.72rem .85rem; border-bottom:1px solid #e8eff4; font-size:.88rem; } .warehouse-list div:last-child { border:0; } .warehouse-list b { display:block; margin-bottom:.12rem; } .warehouse-list span { color:var(--muted); font-size:.79rem; }
    .sync-panel { background:white; border:1px solid var(--line); border-radius:14px; padding:1rem; }
    .sync-panel h2 { margin:0 0 .35rem; font-size:1rem; } .sync-panel p { margin:.3rem 0 .8rem; color:#486476; font-size:.84rem; }
    .sync-panel label { display:block; margin:.7rem 0 .25rem; font-size:.8rem; color:#486476; font-weight:700; }
    .sync-panel input { width:100%; border:1px solid #cbdbe6; border-radius:8px; padding:.6rem .65rem; color:var(--ink); background:#fbfdff; }
    .sync-actions { display:flex; gap:.5rem; flex-wrap:wrap; margin-top:.85rem; }
    .sync-actions button { border:1px solid #b7cddd; border-radius:8px; padding:.55rem .75rem; cursor:pointer; background:#eef5fa; color:#245675; font-weight:700; }
    .sync-actions button.primary { background:#2170a8; color:white; border-color:#2170a8; }
    .sync-status { margin-top:.75rem; padding:.6rem .7rem; border-radius:8px; background:#f2f7fa; color:#486476; font-size:.8rem; }
    .sync-steps { margin:.8rem 0 0; padding-left:1.2rem; color:#486476; font-size:.82rem; }
    .oauth-account { padding:.65rem .7rem; border-radius:8px; background:#eef6fb; color:#31566d; font-size:.84rem; }
    .legacy-sync { margin-top:1rem; border-top:1px solid var(--line); padding-top:.8rem; color:#486476; font-size:.82rem; }
    .legacy-sync summary { cursor:pointer; font-weight:700; color:#245675; }
    .sync-actions button:disabled { opacity:.5; cursor:not-allowed; }
    .hint { color:var(--muted); font-size:.76rem; text-align:center; margin:1rem 0 0; }
    @media (min-width:700px) { main { padding:1.25rem 1.5rem 2.5rem; } header { padding:1.35rem 1.5rem; } .rolebar { padding-left:1.5rem; padding-right:1.5rem; } }

<body>
  <div class="app">
    <header><div class="topline"><div><h1>瑪奇 Mobile｜日週清單</h1><p class="sub">六角色 · 每日／每週 · 材料倉庫分工</p></div><div class="date" id="date"></div></div></header>
    <nav class="rolebar" id="rolebar" aria-label="選擇角色"></nav>
    <main>
      <section class="identity" id="identity"></section>
      <section class="meter"><b id="meter-title">今日完成度</b><span id="meter-label"></span><div class="track"><div class="fill" id="meter-fill"></div></div></section>
      <nav class="tabs" aria-label="檢視"><button class="tab active" data-view="daily">今日</button><button class="tab" data-view="weekly">本週</button><button class="tab" data-view="exchange">採購</button><button class="tab" data-view="storage">倉庫</button><button class="tab" data-view="sync">同步</button></nav>
      <section id="view"></section>
      <p class="hint">未登入或未設定同步時，勾選與進度會留在目前裝置；使用 Google OAuth 登入後可與 Google Sheets 同步。</p>
    </main>
  </div>
  <script>
    // OAuth Client ID 是公開識別資訊，可放在 GitHub Pages；Client Secret 絕對不能放在前端。
    const GOOGLE_OAUTH_CLIENT_ID = '976329781353-fq4medc7itckkh4203vr8uu2o8s20brk.apps.googleusercontent.com';
    // 填入需要使用本工具的 1～2 個 Google 帳號；留空時由 Google Sheet 共用權限作為實際限制。
    const ALLOWED_GOOGLE_EMAILS = [
      // 'primary@example.com',
      // 'second@example.com'
    ];
    const SPREADSHEET_ID = '1j_cvx66Lov33ctQ5inba3sBn56qhLqWf0_gOlC_Rt8g';
    const HISTORY_SHEET = '歷史紀錄';
    const GOOGLE_SHEETS_SCOPE = 'https://www.googleapis.com/auth/spreadsheets';
    const GOOGLE_OAUTH_SCOPE = `${GOOGLE_SHEETS_SCOPE} https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile openid`;
    const SHEETS_API = 'https://sheets.googleapis.com/v4/spreadsheets';
    const USERINFO_API = 'https://openidconnect.googleapis.com/v1/userinfo';

    const roles=[
      {id:'main',name:'貓又老師',sheetRole:'貓又老師(魔法師)',job:'魔法師',store:'金屬／礦石',detail:'金屬、礦石、錠、鍛造原料',rule:'可轉移生活材料請轉入此角色。',daily:['每日任務','週幾地下城','兼職：聖水／重要兼職','銀幣清理（狩獵場／地下城）','每日限購／免費商品檢查','黑色坑洞：每日保底','魔族供品清理→深層地下城'],weekly:[['不詳的召喚結界',7],['黑色坑洞',14],['野外首領週戰利品',3],['每週任務',1],['生活材料商店：本週採購',1],['魔物討伐證明週商店／交換',1],['深淵通關戰利品',3],['週末深淵活動',3]]},
      {id:'z',name:'貓又老師z',sheetRole:'貓又老師z(電擊術士)',job:'電擊術士',store:'草藥／藥劑',detail:'藥草、蘑菇、花粉、濃縮液',rule:'所有藥劑素材集中此處。',daily:['每日任務','週幾地下城','兼職：聖水／重要兼職','銀幣清理（狩獵場／地下城）','每日限購／免費商品檢查','黑色坑洞：每日保底'],weekly:[['不詳的召喚結界',7],['黑色坑洞',14],['野外首領週戰利品',3],['每週任務',1],['生活材料商店：本週採購',1],['魔物討伐證明週商店／交換',1]]},
      {id:'zz',name:'貓又老師zz',sheetRole:'貓又老師zz(長弓兵)',job:'長弓兵',store:'木材／皮革',detail:'木材、樹液、皮革、纖維',rule:'採集與製作原料集中此處。'},
      {id:'o',name:'貓又老師o',sheetRole:'貓又老師o(樂師)',job:'樂師',store:'料理食材',detail:'肉、鹽、糖、油、蔬果、料理成品',rule:'雜貨店料理材料轉入此處。'},
      {id:'p',name:'貓又老師p',sheetRole:'貓又老師p(祭司)',job:'祭司',store:'布料／染料',detail:'羊毛、線、布料、染料、裁縫副料',rule:'紡織與外觀材料集中此處。'},
      {id:'oo',name:'貓又老師oo',sheetRole:'貓又老師oo(修道士)',job:'修道士',store:'彈性／活動材料',detail:'活動材料、可交易製作材料、待分類物品',rule:'每週整理一次；不要把寶石、符文放進這裡。'}
    ];
    const baseDaily=['每日任務','週幾地下城','兼職：聖水／重要兼職','銀幣清理（狩獵場／地下城）','每日限購／免費商品檢查','黑色坑洞：每日保底'];
    const baseWeekly=[['不詳的召喚結界',7],['黑色坑洞',14],['野外首領週戰利品',3],['每週任務',1],['生活材料商店：本週採購',1],['魔物討伐證明週商店／交換',1]];
    roles.forEach(r=>{r.daily??=baseDaily;r.weekly??=baseWeekly});

    // 保留舊陣列與索引，讓既有 LocalStorage／Google Sheets 歷史資料仍可讀取。
    const ACCOUNT_ROLE='帳號共用';
    const ACCOUNT_DAILY_TASK={id:'daily_account_exchange',label:'帳號共用：今日必要採購／交換確認',note:'帳號完成一次即可，明細移至「採購」頁',category:'帳號共用'};
    const ACCOUNT_STATE_KEY=`account-d-${ACCOUNT_DAILY_TASK.id}`;
    const ACCOUNT_TASK_ALIASES=new Set(['每日限購／免費商品檢查',ACCOUNT_DAILY_TASK.label]);
    const HIDDEN_DAILY_TASKS=new Set(['銀幣清理（狩獵場／地下城）',...ACCOUNT_TASK_ALIASES]);
    const ACCOUNT_ROLE_RECORD={sheetRole:ACCOUNT_ROLE};

    let active='main',view='daily';
    const key='mabi-mobile-web-demo-v1';
    const syncKey='mabi-mobile-sync-v1';
    const state=loadObject(key);
    const syncConfig=loadObject(syncKey);
    let syncStatus='尚未設定同步';
    const oauth={accessToken:'',expiresAt:0,user:null,tokenClient:null};

    function loadObject(storageKey){try{return JSON.parse(localStorage.getItem(storageKey)||'{}')}catch{return {}}}
    const save=()=>localStorage.setItem(key,JSON.stringify(state));
    const get=(k,d)=>state[k]??d;
    const set=(k,v)=>{state[k]=v;save();render()};
    if(state[ACCOUNT_STATE_KEY]===undefined){
      const legacyAccountChecked=roles.some(role=>role.daily.some((task,index)=>ACCOUNT_TASK_ALIASES.has(task)&&Boolean(state[`${role.id}-d-${index}`])));
      if(legacyAccountChecked){state[ACCOUNT_STATE_KEY]=true;save()}
    }
    const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const oauthConfigured=()=>Boolean(GOOGLE_OAUTH_CLIENT_ID&&!GOOGLE_OAUTH_CLIENT_ID.startsWith('REPLACE_WITH_'));
    const oauthSignedIn=()=>Boolean(oauth.accessToken&&oauth.user);
    const allowedEmails=()=>ALLOWED_GOOGLE_EMAILS.map(email=>email.trim().toLowerCase()).filter(Boolean);

    function syncReady(){return Boolean(syncConfig.url&&syncConfig.token)}
    function jsonp(params){return new Promise((resolve,reject)=>{if(!syncReady())return reject(new Error('請先填入同步網址與密鑰'));const cb='mabiSync_'+Date.now()+'_'+Math.random().toString(36).slice(2);const script=document.createElement('script');const url=new URL(syncConfig.url);Object.entries({...params,callback:cb,token:syncConfig.token}).forEach(([k,v])=>url.searchParams.set(k,String(v)));let timer;const cleanup=()=>{clearTimeout(timer);delete window[cb];script.remove()};window[cb]=data=>{cleanup();resolve(data)};script.onerror=()=>{cleanup();reject(new Error('無法連線到 Apps Script'))};script.src=url.toString();document.body.appendChild(script);timer=setTimeout(()=>{cleanup();reject(new Error('同步逾時'))},12000)})}

    async function syncReadLegacy(){
      if(!syncReady()){syncStatus='請先儲存備援同步網址與密鑰';render();return}
      syncStatus='讀取 Google Sheets 中…';render();
      try{const result=await jsonp({action:'read'});if(!result.ok)throw new Error(result.error||'讀取失敗');applyItems(result.items);syncStatus=`Token 備援已同步：${result.items.length} 筆（${result.gameDate}）`;render()}
      catch(err){syncStatus='Token 備援讀取失敗：'+err.message;render()}
    }

    async function syncWriteLegacy(r,task,cycle,progress,target){
      if(!syncReady())return;
      try{await jsonp({action:'save',role:r.sheetRole,task,cycle,progress,target});syncStatus='已由 Token 備援同步至 Google Sheets';if(view==='sync')render()}
      catch(err){syncStatus='Token 備援寫入失敗：'+err.message;if(view==='sync')render()}
    }

    function waitForGoogleIdentity(){
      return new Promise((resolve,reject)=>{const start=Date.now();const check=()=>{if(window.google?.accounts?.oauth2)return resolve();if(Date.now()-start>12000)return reject(new Error('Google Identity Services 尚未載入，請重新整理頁面'));setTimeout(check,100)};check()})
    }

    async function fetchUserInfo(token){
      const response=await fetch(USERINFO_API,{headers:{Authorization:`Bearer ${token}`}});
      const body=await response.json().catch(()=>({}));
      if(!response.ok)throw new Error(body.error_description||'無法取得 Google 帳號資訊');
      const email=String(body.email||'').trim().toLowerCase();
      const allowlist=allowedEmails();
      if(allowlist.length&&!allowlist.includes(email))throw new Error(`帳號 ${email||'未知'} 不在允許清單中`);
      return {...body,email};
    }

    async function requestOAuthAccess(prompt='select_account'){
      if(!oauthConfigured())throw new Error('尚未設定 Google OAuth Client ID，請修改 index.html 的 GOOGLE_OAUTH_CLIENT_ID');
      await waitForGoogleIdentity();
      if(!oauth.tokenClient)oauth.tokenClient=window.google.accounts.oauth2.initTokenClient({client_id:GOOGLE_OAUTH_CLIENT_ID,scope:GOOGLE_OAUTH_SCOPE,callback:()=>{}});
      return new Promise((resolve,reject)=>{
        oauth.tokenClient.callback=async response=>{
          if(response.error){reject(new Error(response.error_description||response.error));return}
          try{oauth.accessToken=response.access_token;oauth.expiresAt=Date.now()+Number(response.expires_in||3600)*1000;oauth.user=await fetchUserInfo(oauth.accessToken);resolve(oauth.user)}
          catch(err){oauth.accessToken='';oauth.expiresAt=0;oauth.user=null;reject(err)}
        };
        oauth.tokenClient.requestAccessToken({prompt});
      });
    }

    function logoutOAuth(){
      const token=oauth.accessToken;
      oauth.accessToken='';oauth.expiresAt=0;oauth.user=null;
      if(token&&window.google?.accounts?.oauth2?.revoke)window.google.accounts.oauth2.revoke(token,()=>{});
      syncStatus='已登出 Google';render();
    }

    async function sheetsRequest(path,options={},retry=true){
      if(!oauth.accessToken||Date.now()>oauth.expiresAt-60000)await requestOAuthAccess('');
      const headers={Accept:'application/json',...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{}),Authorization:`Bearer ${oauth.accessToken}`};
      const response=await fetch(`${SHEETS_API}/${path}`,{...options,headers});
      if(response.status===401&&retry){oauth.accessToken='';oauth.expiresAt=0;return sheetsRequest(path,options,false)}
      const raw=await response.text();let body={};try{body=raw?JSON.parse(raw):{}}catch{}
      if(!response.ok){const detail=body.error?.message||body.error_description||raw.slice(0,240)||'Google 未提供詳細訊息';throw new Error(`Google Sheets API 錯誤（${response.status}）：${detail}`)}
      return raw?JSON.parse(raw):{};
    }

    function sheetTitle(){return `'${HISTORY_SHEET.replace(/'/g,"''")}'`}
    function encodedRange(range){return encodeURIComponent(range)}
    function sheetRange(){return `${sheetTitle()}!A:Z`}
    function columnName(index){let name='';let n=index+1;while(n){const remainder=(n-1)%26;name=String.fromCharCode(65+remainder)+name;n=Math.floor((n-1)/26)}return name}
    function text(value){return value===null||value===undefined?'':String(value).trim()}
    function number(value){const n=Number(value);return Number.isFinite(n)?n:0}
    function dateText(value){const s=text(value).replace(/\//g,'-');const match=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);return match?`${match[1]}-${String(match[2]).padStart(2,'0')}-${String(match[3]).padStart(2,'0')}`:s}
    function completeValue(value){return value===true||text(value).toUpperCase()==='TRUE'||text(value)==='1'}

    function gameDateKey(){
      const local=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Taipei'}));
      if(local.getHours()<6)local.setDate(local.getDate()-1);
      return `${local.getFullYear()}-${String(local.getMonth()+1).padStart(2,'0')}-${String(local.getDate()).padStart(2,'0')}`;
    }
    function gameDateLabel(){return new Date(`${gameDateKey()}T12:00:00`).toLocaleDateString('zh-TW',{month:'numeric',day:'numeric',weekday:'short'})}
    function weekStart(dateKey){const date=new Date(`${dateKey}T12:00:00`);const mondayOffset=(date.getDay()+6)%7;date.setDate(date.getDate()-mondayOffset);return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`}
    function findHeader(values){
      for(let rowIndex=0;rowIndex<Math.min(values.length,12);rowIndex++){
        const row=(values[rowIndex]||[]).map(text);
        if(row.includes('重置日')&&row.includes('角色')&&row.includes('任務名稱')){
          const cols={};row.forEach((name,index)=>{if(name)cols[name]=index});
          ['重置日','角色','任務名稱','週期','進度','目標','完成'].forEach(name=>{if(cols[name]===undefined)throw new Error(`歷史紀錄缺少欄位：${name}`)});
          return {rowIndex,cols,width:Math.max(row.length,8)};
        }
      }
      throw new Error('找不到歷史紀錄標題列');
    }

    async function readOAuthSheet(){
      const result=await sheetsRequest(`values/${encodedRange(sheetRange())}?majorDimension=ROWS`);
      const values=result.values||[];const header=findHeader(values);const currentDate=gameDateKey();const weeklyDate=weekStart(currentDate);const items=[];
      for(let index=header.rowIndex+1;index<values.length;index++){
        const row=values[index]||[];const cycle=text(row[header.cols['週期']]);const date=dateText(row[header.cols['重置日']]);
        if((cycle==='每日'&&date!==currentDate)||(cycle==='每週'&&date!==weeklyDate))continue;
        if(cycle!=='每日'&&cycle!=='每週')continue;
        items.push({resetDate:date,role:text(row[header.cols['角色']]),task:text(row[header.cols['任務名稱']]),cycle,progress:number(row[header.cols['進度']]),target:number(row[header.cols['目標']]),complete:completeValue(row[header.cols['完成']])});
      }
      return {items,gameDate:currentDate};
    }

    function applyItems(items){
      let accountItem=null;let legacyAccountSeen=false;let legacyAccountComplete=false;
      (items||[]).forEach(item=>{
        if(item.cycle==='每日'&&ACCOUNT_TASK_ALIASES.has(item.task)){
          if(item.role===ACCOUNT_ROLE)accountItem=item;else{legacyAccountSeen=true;if(item.complete)legacyAccountComplete=true}
          return;
        }
        const role=roles.find(candidate=>candidate.sheetRole===item.role);if(!role)return;
        if(item.cycle==='每日'){const index=role.daily.indexOf(item.task);if(index>=0&&!HIDDEN_DAILY_TASKS.has(item.task))state[`${role.id}-d-${index}`]=Boolean(item.complete)}
        else if(item.cycle==='每週'){const index=role.weekly.findIndex(([name])=>name===item.task);if(index>=0)state[`${role.id}-w-${index}`]=number(item.progress)}
      });
      if(accountItem)state[ACCOUNT_STATE_KEY]=Boolean(accountItem.complete);else if(legacyAccountSeen)state[ACCOUNT_STATE_KEY]=legacyAccountComplete;
      save()
    }

    async function oauthLogin(){
      syncStatus='等待 Google 授權…';render();
      try{await requestOAuthAccess('select_account');const result=await readOAuthSheet();applyItems(result.items);syncStatus=`OAuth 已登入 ${oauth.user.email}，讀取 ${result.items.length} 筆`;render()}
      catch(err){syncStatus='OAuth 登入失敗：'+err.message;render()}
    }

    async function oauthRead(){
      if(!oauthSignedIn()){syncStatus='請先使用 Google 登入';render();return}
      syncStatus='OAuth 讀取 Google Sheets 中…';render();
      try{const result=await readOAuthSheet();applyItems(result.items);syncStatus=`OAuth 已同步：${result.items.length} 筆（${result.gameDate}）`;render()}
      catch(err){syncStatus='OAuth 讀取失敗：'+err.message;render()}
    }

    async function oauthSaveItem(role,task,cycle,progress,target){
      if(!oauthSignedIn())return;
      const result=await sheetsRequest(`values/${encodedRange(sheetRange())}?majorDimension=ROWS`);const values=result.values||[];const header=findHeader(values);const resetDate=cycle==='每日'?gameDateKey():weekStart(gameDateKey());const boundedProgress=Math.max(0,Math.min(Math.max(1,number(target)),number(progress)));const complete=boundedProgress>=Math.max(1,number(target));
      const keyValue=`${resetDate}\u0000${role.sheetRole}\u0000${task}`;let targetIndex=-1;
      for(let index=header.rowIndex+1;index<values.length;index++){const row=values[index]||[];const rowKey=`${dateText(row[header.cols['重置日']])}\u0000${text(row[header.cols['角色']])}\u0000${text(row[header.cols['任務名稱']])}`;if(rowKey===keyValue&&text(row[header.cols['週期']])===cycle){targetIndex=index;break}}
      if(targetIndex<0){const row=Array(header.width).fill('');row[header.cols['重置日']]=resetDate;row[header.cols['角色']]=role.sheetRole;row[header.cols['任務名稱']]=task;row[header.cols['週期']]=cycle;row[header.cols['進度']]=boundedProgress;row[header.cols['目標']]=Math.max(1,number(target));row[header.cols['完成']]=complete;if(header.cols['備註']!==undefined)row[header.cols['備註']]='由 GitHub Pages OAuth 同步建立';await sheetsRequest(`values/${encodedRange(sheetRange())}:append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS`,{method:'POST',body:JSON.stringify({majorDimension:'ROWS',values:[row]})})}
      else{const row=Array(Math.max(header.width,(values[targetIndex]||[]).length)).fill('');(values[targetIndex]||[]).forEach((value,index)=>{row[index]=value});row[header.cols['進度']]=boundedProgress;row[header.cols['目標']]=Math.max(1,number(target));row[header.cols['完成']]=complete;const range=`${sheetTitle()}!A${targetIndex+1}:${columnName(row.length-1)}${targetIndex+1}`;await sheetsRequest(`values/${encodedRange(range)}?valueInputOption=USER_ENTERED`,{method:'PUT',body:JSON.stringify({majorDimension:'ROWS',values:[row]})})}
    }

    async function syncWrite(role,task,cycle,progress,target){
      if(oauthSignedIn()){try{await oauthSaveItem(role,task,cycle,progress,target);syncStatus='已由 OAuth 同步至 Google Sheets';if(view==='sync')render()}catch(err){syncStatus='OAuth 寫入失敗：'+err.message;if(view==='sync')render()}return}
      await syncWriteLegacy(role,task,cycle,progress,target);
    }

    const visibleDailyTasks=role=>role.daily.map((task,index)=>({task,index})).filter(item=>!HIDDEN_DAILY_TASKS.has(item.task));
    const dailyCategory=task=>task.includes('兼職')||task==='每日任務'||task==='週幾地下城'?'每日核心':task.includes('供品')?'供品／深層':task.includes('坑洞')||task.includes('結界')?'機會型內容':'其他';
    const weeklyCategory=task=>task.includes('深淵')||task.includes('週末')?'本尊高難／活動':task.includes('結界')||task.includes('坑洞')||task.includes('首領')?'必做週課':'採購／一般週課';
    function groupedTasks(items,categoryOf){const groups=new Map();items.forEach(item=>{const category=categoryOf(item.task);if(!groups.has(category))groups.set(category,[]);groups.get(category).push(item)});return [...groups.entries()]}
    function progress(){const role=roles.find(x=>x.id===active);if(view==='daily'){const tasks=visibleDailyTasks(role);const done=tasks.filter(item=>get(`${active}-d-${item.index}`,false)).length+(get(ACCOUNT_STATE_KEY,false)?1:0);return [done,tasks.length+1]}if(view==='weekly'){const done=role.weekly.filter(([,target],index)=>get(`${active}-w-${index}`,0)>=target).length;return [done,role.weekly.length]}return [0,0]}
    function render(){
      const role=roles.find(x=>x.id===active);document.querySelector('#rolebar').innerHTML=roles.map(x=>`<button class="role ${x.id===active?'active':''}" data-role="${x.id}">${x.name}</button>`).join('');
      document.querySelector('#identity').innerHTML=`<strong>${role.name} <span style="color:#607487;font-weight:500">｜${role.job}</span></strong><p>倉庫分工：<b>${role.store}</b>　${role.rule}</p>`;
      document.querySelectorAll('.tab').forEach(button=>button.classList.toggle('active',button.dataset.view===view));
      const [done,total]=progress();const syncLabel=oauthSignedIn()?`已登入：${oauth.user.email}`:syncReady()?'Token 備援可用':syncStatus;
      document.querySelector('#meter-title').textContent=view==='daily'?'今日完成度':view==='weekly'?'本週完成度':view==='exchange'?'採購／交換':view==='storage'?'倉庫分工':'同步狀態';document.querySelector('#meter-label').textContent=view==='storage'?'6 角色已配置':view==='exchange'?'台服資料待核對':view==='sync'?syncLabel:`${done} / ${total}`;document.querySelector('#meter-fill').style.width=view==='storage'?'100%':view==='sync'?(oauthSignedIn()||syncReady()?'100%':'0%'):view==='exchange'?'0%':`${total?done/total*100:0}%`;
      document.querySelector('#date').textContent='遊戲日 '+gameDateLabel();
      const root=document.querySelector('#view');
      if(view==='daily'){
        const accountDone=get(ACCOUNT_STATE_KEY,false);
        const accountHtml=`<div class="shared-card"><div class="section-title"><h2>帳號共用</h2><small>完成一次即可</small></div><div class="card"><label class="task ${accountDone?'done':''}"><input type="checkbox" ${accountDone?'checked':''} data-account-daily><span><span class="task-name">${ACCOUNT_DAILY_TASK.label}</span><span class="task-note">${ACCOUNT_DAILY_TASK.note}</span></span><span class="pill">帳號</span></label></div></div>`;
        const groups=groupedTasks(visibleDailyTasks(role),dailyCategory).map(([category,tasks])=>`<details class="task-group" open><summary>${category}<small>${tasks.filter(item=>get(`${active}-d-${item.index}`,false)).length} / ${tasks.length}</small></summary><div class="card">${tasks.map(item=>{const checked=get(`${active}-d-${item.index}`,false);return `<label class="task ${checked?'done':''}"><input type="checkbox" ${checked?'checked':''} data-d="${item.index}"><span><span class="task-name">${item.task}</span><span class="task-note">${item.task.includes('坑洞')?'有遇到再處理':'角色個別計算'}</span></span><span class="pill">每日</span></label>`}).join('')}</div></details>`).join('');
        root.innerHTML=`<div class="section-title"><h2>今日待辦</h2><small>06:00 重置</small></div>${accountHtml}${groups}`;
      }
      if(view==='weekly'){
        const weeklyItems=role.weekly.map(([task,target],index)=>({task,target,index}));
        const groups=groupedTasks(weeklyItems, item=>weeklyCategory(item.task)).map(([category,tasks])=>`<details class="task-group" open><summary>${category}<small>${tasks.filter(item=>get(`${active}-w-${item.index}`,0)>=item.target).length} / ${tasks.length}</small></summary><div class="card">${tasks.map(item=>{const value=Math.min(get(`${active}-w-${item.index}`,0),item.target);return `<div class="week ${value>=item.target?'complete':''}"><div><div class="week-name">${item.task}</div><small>${value>=item.target?'已完成':'尚未達標'} · ${value} / ${item.target}</small></div><div class="stepper"><button aria-label="減少 ${item.task}" data-step="${item.index}" data-delta="-1">−</button><output>${value}</output><button aria-label="增加 ${item.task}" data-step="${item.index}" data-delta="1">＋</button></div><progress value="${value}" max="${item.target}"></progress></div>`}).join('')}</div></details>`).join('');
        root.innerHTML=`<div class="section-title"><h2>本週待辦</h2><small>週一 06:00 重置</small></div>${groups}`;
      }
      if(view==='exchange')root.innerHTML=`<div class="section-title"><h2>採購／交換</h2><small>地區 → NPC → 商品</small></div><div class="exchange-intro"><h3>先記真正需要記憶的交換</h3><p>這裡會放台服已確認的 NPC、商品、成本與每日／每週限制；今日頁只保留一個帳號共用的完成確認，不再讓六個角色重複勾選泛用採購。</p><div class="exchange-fields"><div class="exchange-field"><b>資料範圍</b>地區／NPC／商品</div><div class="exchange-field"><b>成本</b>材料與數量</div><div class="exchange-field"><b>週期</b>每日／每週／活動</div><div class="exchange-field"><b>追蹤方式</b>帳號／角色</div></div></div><div class="exchange-empty"><h3>交換路線資料尚未加入</h3><p>目前不直接把韓服舊 Sheet 翻成台服正式資料，避免顯示過期或錯誤的 NPC 內容。</p><p>你確認台服實際項目後，再把它們填入這個入口；OAuth 與既有歷史紀錄不會因此被改寫。</p></div>`;
      if(view==='storage')root.innerHTML=`<div class="warehouse"><div class="warehouse-icon">▣</div><div><h2>${role.store} 倉</h2><p>${role.detail}</p></div><div class="rule">${role.rule} 寶石、符文等角色個人資源，留在取得角色身上。</div></div><div class="warehouse-list">${roles.map(item=>`<div><b>${item.name}｜${item.store}</b><span>${item.detail}</span></div>`).join('')}</div>`;
      if(view==='sync'){
        const oauthButton=oauthConfigured()?'':'disabled';const account=oauthSignedIn()?`<div class="oauth-account">目前帳戶：<b>${escapeHtml(oauth.user.email)}</b></div>`:'<div class="oauth-account">尚未登入 Google</div>';
        root.innerHTML=`<div class="sync-panel"><h2>Google OAuth 同步</h2><p>使用固定 Google 帳號登入後，直接讀寫指定的 Google Sheet。Access Token 只保存在目前頁面的記憶體，不寫入 localStorage。</p>${account}<div class="sync-actions"><button class="primary" data-oauth-login ${oauthButton}>使用 Google 登入</button><button data-oauth-read ${oauthSignedIn()?'':'disabled'}>重新讀取 Sheets</button><button data-oauth-logout ${oauthSignedIn()?'':'disabled'}>登出</button></div><div class="sync-status">${escapeHtml(syncStatus)}</div><ol class="sync-steps"><li>在 Google Cloud 建立 Web OAuth Client ID，將 GitHub Pages 的 origin 加入 Authorized JavaScript origins。</li><li>把需要使用的 1～2 個 Google 帳號加入 OAuth 測試使用者，並將同一份 Sheet 共用給它們。</li><li>在本檔案設定 <b>GOOGLE_OAUTH_CLIENT_ID</b>；若要加強介面限制，再填入 <b>ALLOWED_GOOGLE_EMAILS</b>。</li></ol><details class="legacy-sync"><summary>備援：Token／Apps Script 同步版</summary><p>OAuth 尚未設定或暫時無法使用時，仍可使用原本的 Apps Script Web App。網址與密鑰只存於此瀏覽器。</p><label for="sync-url">Apps Script 網頁應用程式網址（/exec）</label><input id="sync-url" type="url" placeholder="https://script.google.com/macros/s/.../exec" value="${escapeHtml(syncConfig.url||'')}"><label for="sync-token">同步密鑰</label><input id="sync-token" type="password" placeholder="建立 Apps Script 時設定的密鑰" value="${escapeHtml(syncConfig.token||'')}"><div class="sync-actions"><button data-sync-save>儲存備援設定</button><button data-sync-read>從 Google Sheets 讀取</button></div></details></div>`;
      }
      document.querySelectorAll('[data-role]').forEach(button=>button.onclick=()=>{active=button.dataset.role;render()});
      document.querySelectorAll('[data-d]').forEach(checkbox=>checkbox.onchange=()=>{const currentRole=roles.find(x=>x.id===active);const task=currentRole.daily[Number(checkbox.dataset.d)];set(`${active}-d-${checkbox.dataset.d}`,checkbox.checked);syncWrite(currentRole,task,'每日',checkbox.checked?1:0,1)});
      document.querySelectorAll('[data-account-daily]').forEach(checkbox=>checkbox.onchange=()=>{set(ACCOUNT_STATE_KEY,checkbox.checked);syncWrite(ACCOUNT_ROLE_RECORD,ACCOUNT_DAILY_TASK.label,'每日',checkbox.checked?1:0,1)});
      document.querySelectorAll('[data-step]').forEach(button=>button.onclick=()=>{const index=Number(button.dataset.step),target=role.weekly[index][1],old=get(`${active}-w-${index}`,0),next=Math.max(0,Math.min(target,old+Number(button.dataset.delta)));set(`${active}-w-${index}`,next);syncWrite(role,role.weekly[index][0],'每週',next,target)});
      document.querySelector('[data-oauth-login]')?.addEventListener('click',oauthLogin);document.querySelector('[data-oauth-read]')?.addEventListener('click',oauthRead);document.querySelector('[data-oauth-logout]')?.addEventListener('click',logoutOAuth);
      document.querySelector('[data-sync-save]')?.addEventListener('click',()=>{syncConfig.url=document.querySelector('#sync-url').value.trim();syncConfig.token=document.querySelector('#sync-token').value.trim();localStorage.setItem(syncKey,JSON.stringify(syncConfig));syncStatus=syncReady()?'備援同步設定已儲存':'請完整填入備援網址與密鑰';render()});document.querySelector('[data-sync-read]')?.addEventListener('click',syncReadLegacy);
    }
    document.querySelectorAll('.tab').forEach(button=>button.onclick=()=>{view=button.dataset.view;render()});
    render();
  </script>
</body>
</html>
