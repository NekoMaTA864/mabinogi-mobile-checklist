<!doctype html>
<html lang="zh-Hant">
<head>

  <title>瑪奇 Mobile｜日週清單</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23102d45'/%3E%3Cpath d='M18 34l9 9 19-22' fill='none' stroke='%23dcecff' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <style>
    :root { --navy:#102d45; --blue:#1e5d8f; --ice:#e6f2fb; --paper:#f6f9fc; --ink:#183145; --muted:#607487; --line:#d7e3ed; --mint:#e9f6ef; --mint-ink:#176043; --amber:#fff4d7; --amber-ink:#815400; }
    * { box-sizing:border-box; }
    body { margin:0; background:linear-gradient(150deg,#eaf3f9 0%,#f7fafc 43%,#e7f0f6 100%); color:var(--ink); font:16px/1.45 system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif; min-height:100vh; }
    button,input { font:inherit; }
    .app { max-width:780px; margin:0 auto; min-height:100vh; background:var(--paper); box-shadow:0 0 50px #3150661b; }
    header { background:var(--navy); color:white; padding:1.15rem 1rem 1rem; }
    .topline { display:flex; justify-content:space-between; align-items:start; gap:1rem; }
    h1 { margin:0; font-size:1.2rem; letter-spacing:.02em; }
    .date { color:#d4e6f5; font-size:.82rem; white-space:nowrap; }
    .sub { color:#bfd4e6; margin:.32rem 0 0; font-size:.82rem; }

    .role.active { border-color:var(--blue); background:var(--blue); color:white; font-weight:700; }
    main { padding:1rem; padding-bottom:2rem; }

    .focus-banner { display:flex; justify-content:space-between; gap:.7rem; align-items:center; padding:.68rem .85rem; margin-bottom:.8rem; background:#fffdf4; border:1px solid #eadcae; border-radius:12px; color:#68552b; }
    .focus-banner strong { font-size:.86rem; }
    .focus-banner small { color:#816f45; font-size:.76rem; text-align:right; }
    .role-marker { margin-bottom:.8rem; }

    .meter { display:grid; grid-template-columns:1fr auto; gap:.5rem 1rem; align-items:center; background:#fff; border:1px solid var(--line); border-radius:14px; padding:.8rem .9rem; margin-bottom:1rem; }
    .meter b { font-size:.9rem; } .meter span { color:var(--muted); font-size:.83rem; }
    .track { grid-column:1/-1; height:7px; background:#e3edf4; overflow:hidden; border-radius:99px; } .fill { height:100%; background:linear-gradient(90deg,#2170a8,#4a9ccd); border-radius:99px; transition:width .2s; }
    .tabs { display:grid; grid-template-columns:repeat(6,1fr); gap:.36rem; padding:.34rem; background:#e5edf3; border-radius:12px; margin-bottom:1rem; }

    .tab.active { background:white; color:var(--navy); box-shadow:0 1px 3px #18314519; }
    .section-title { display:flex; justify-content:space-between; align-items:center; margin:.2rem 0 .5rem; } .section-title h2 { margin:0; font-size:1rem; } .section-title small { color:var(--muted); }
    .card { background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; }
    .task { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:.7rem; min-height:3.85rem; padding:.65rem .8rem; border-bottom:1px solid #e8eff4; cursor:pointer; touch-action:manipulation; }
    .task:last-child { border-bottom:0; } .task.done .task-name { color:#8294a2; text-decoration:line-through; }
    .task input[type=checkbox],
    .week-check input[type=checkbox],
    .exchange-control input[type=checkbox] { appearance:none; -webkit-appearance:none; width:1.2rem; height:1.2rem; border:2px solid #8fa8ba; border-radius:5px; display:grid; place-content:center; cursor:pointer; pointer-events:auto; margin:0; background:#fff; transition:background-color .12s,border-color .12s; }
    .task input[type=checkbox]::before,
    .week-check input[type=checkbox]::before,
    .exchange-control input[type=checkbox]::before { content:""; width:.55rem; height:.3rem; border-left:2px solid white; border-bottom:2px solid white; transform:rotate(-45deg) scale(0); margin-top:-.13rem; }
    .task input[type=checkbox]:checked,
    .week-check input[type=checkbox]:checked,
    .exchange-control input[type=checkbox]:checked { background:#2170a8; border-color:#2170a8; }
    .task input[type=checkbox]:checked::before,
    .week-check input[type=checkbox]:checked::before,
    .exchange-control input[type=checkbox]:checked::before { transform:rotate(-45deg) scale(1); }
    .task input[type=checkbox]:focus-visible,
    .week-check input[type=checkbox]:focus-visible,
    .exchange-control input[type=checkbox]:focus-visible { outline:3px solid #83b9de; outline-offset:2px; }
    .task-name { font-weight:650; font-size:.94rem; } .task-note { color:var(--muted); font-size:.76rem; margin-top:.08rem; }
    .pill { background:#eef5fa; color:#47677d; font-size:.73rem; padding:.22rem .45rem; border-radius:99px; white-space:nowrap; }
    .week { display:grid; grid-template-columns:1fr auto; gap:.5rem .8rem; padding:.78rem .8rem; border-bottom:1px solid #e8eff4; align-items:center; } .week:last-child { border:0; }
    .week-name { font-weight:650; font-size:.94rem; } .week small { color:var(--muted); }
    .stepper { display:flex; align-items:center; border:1px solid #cbdbe6; border-radius:9px; overflow:hidden; background:white; } .stepper button { border:0; background:#eef5fa; color:#245675; min-width:2rem; min-height:2rem; cursor:pointer; font-weight:800; } .stepper output { min-width:2.45rem; text-align:center; font-weight:750; font-size:.9rem; }
    .week progress { grid-column:1/-1; width:100%; height:7px; accent-color:#2c82b9; } .week.complete { background:var(--mint); } .week.complete .week-name { color:var(--mint-ink); }
    .task-group { margin-bottom:.75rem; }
    .task-group:last-child { margin-bottom:0; }
    .task-group summary { list-style:none; display:flex; justify-content:space-between; align-items:center; cursor:pointer; padding:.68rem .8rem; background:#edf4f8; border:1px solid var(--line); border-radius:12px 12px 0 0; color:#31566d; font-weight:750; font-size:.86rem; }
    .task-group summary::-webkit-details-marker { display:none; }
    .task-group summary::after { content:'⌄'; color:#6d8494; font-size:1rem; transform:rotate(0deg); transition:transform .15s; }
    .task-group:not([open]) summary { border-radius:12px; }

    .exchange-empty { text-align:center; }

    .exchange-alert { margin-bottom:.8rem; padding:.72rem .8rem; border:1px solid #f0d99b; border-radius:12px; background:var(--amber); color:#6f5000; font-size:.82rem; }
    .exchange-alert b { display:block; margin-bottom:.15rem; color:#624600; }
    .exchange-filters { display:flex; gap:.45rem; overflow:auto; padding:.15rem 0 .75rem; scrollbar-width:none; }

    .exchange-role-progress { display:flex; justify-content:space-between; align-items:center; gap:.35rem; min-width:0; padding:.38rem .48rem; border:1px solid #d7e3ed; border-radius:8px; background:#f7fafc; color:#527083; cursor:pointer; text-align:left; font-size:.7rem; font-weight:650; }
    .exchange-role-progress:hover { border-color:#95b9d1; }
    .exchange-role-progress span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    .exchange-role-progress.done { border-color:#c8e4d4; background:var(--mint); color:var(--mint-ink); }
    .exchange-meta { display:flex; flex-wrap:wrap; gap:.3rem; margin-top:.38rem; }

    .procurement-guide { display:grid; gap:.55rem; margin:.8rem 0; }
    .procurement-guide-card { padding:.72rem .78rem; border:1px solid var(--line); border-radius:12px; background:#fff; font-size:.8rem; }
    .procurement-guide-card.priority { background:#fffaf0; border-color:#eadcae; }

    .evidence.limited { background:#eef5fa; color:#47677d; }
    .evidence.reference { background:#f1f4f6; color:#607487; }

    async function sheetsRequest(path,options={},retry=true){

      const headers={Accept:'application/json',...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{}),Authorization:`Bearer ${oauth.accessToken}`};
      const response=await fetch(`${SHEETS_API}/${SPREADSHEET_ID}/${path}`,{...options,headers});
      if(response.status===401&&retry){oauth.accessToken='';oauth.expiresAt=0;return sheetsRequest(path,options,false)}
      const raw=await response.text();let body={};try{body=raw?JSON.parse(raw):{}}catch{}
      if(!response.ok){const detail=body.error?.message||body.error_description||raw.slice(0,240)||'Google 未提供詳細訊息';throw new Error(`Google Sheets API 錯誤（${response.status}）：${detail}`)}
      return raw?JSON.parse(raw):{};
    }

      if(local.getHours()<6)local.setDate(local.getDate()-1);

    }
    function gameDateLabel(){return new Date(`${gameDateKey()}T12:00:00`).toLocaleDateString('zh-TW',{month:'numeric',day:'numeric',weekday:'short'})}
    function weekStart(dateKey){const date=new Date(`${dateKey}T12:00:00`);const mondayOffset=(date.getDay()+6)%7;date.setDate(date.getDate()-mondayOffset);return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`}
    function millisecondsUntilGameReset(){
      const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Taipei',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric',hourCycle:'h23'}).formatToParts(new Date());
      const values=Object.fromEntries(parts.filter(part=>part.type!=='literal').map(part=>[part.type,Number(part.value)]));
      const current=Date.UTC(values.year,values.month-1,values.day,values.hour,values.minute,values.second);
      const todayReset=Date.UTC(values.year,values.month-1,values.day,6);
      const nextReset=current<todayReset?todayReset:Date.UTC(values.year,values.month-1,values.day+1,6);
      return Math.max(1000,nextReset-current+500)
    }

    function findHeader(values){

    function applyItems(items){
      resetStaleDailyState();resetStaleWeeklyState();

      let accountItem=null;let legacyAccountSeen=false;let legacyAccountComplete=false;
      const sharedWeeklySeen=new Set();const sharedWeeklyProgress={};
      (items||[]).forEach(item=>{
        if(item.cycle==='常駐'&&text(item.task).startsWith('庫存保管｜')){
          const materialId=text(item.task).slice('庫存保管｜'.length);const material=MATERIAL_CATALOG.find(candidate=>candidate.id===materialId);const holder=roles[Math.round(number(item.progress))];

          return
        }
        if(item.cycle==='常駐'&&text(item.task).startsWith('庫存｜')){
          const materialId=text(item.task).slice('庫存｜'.length);const material=MATERIAL_CATALOG.find(candidate=>candidate.id===materialId);const role=roles.find(candidate=>candidate.sheetRole===item.role);
          if(material&&role)state[inventoryStateKey(material.id,role.id)]=Math.max(0,number(item.progress));

          const routeId=text(item.task).slice('路線計畫｜'.length);const route=BARTER_ROUTES.find(candidate=>candidate.id===routeId);
          if(route)state[barterPlanStateKey(route.id)]=Math.max(0,Math.min(BARTER_PLAN_TARGET,number(item.progress)));
          return
        }
        if(item.cycle==='每日'&&ACCOUNT_TASK_ALIASES.has(item.task)){
          if(item.role===ACCOUNT_ROLE)accountItem=item;else{legacyAccountSeen=true;if(item.complete)legacyAccountComplete=true}
          return;
        }
        if(item.cycle==='每日'&&item.task===DAILY_ROLE_PURCHASE_TASK.sheetTask){
          const role=roles.find(candidate=>candidate.sheetRole===item.role);
          if(role)state[roleDailyPurchaseStateKey(role.id)]=Boolean(item.complete||number(item.progress)>=1);
          return;
        }
        if(item.cycle==='每日'&&item.task===DAILY_BLACK_HOLE_TASK.sheetTask){
          if(item.role===ACCOUNT_ROLE)state[accountDailyBlackHoleStateKey()]=Boolean(item.complete||number(item.progress)>=1);
          else{
            const role=roles.find(candidate=>candidate.sheetRole===item.role);
            if(role)state[dailyBlackHoleStateKey(role.id)]=Boolean(item.complete||number(item.progress)>=1)
          }
          return;
        }
        if(item.cycle==='每週'&&isAccountWeeklyTask(item.task)){
          const sharedProgress=Math.min(1,Math.max(number(item.progress),item.complete?1:0));
          sharedWeeklySeen.add(item.task);
          sharedWeeklyProgress[item.task]=Math.max(sharedWeeklyProgress[item.task]||0,sharedProgress);
          return;
        }
        if(text(item.task).startsWith('採購｜')){
          const procurement=PROCUREMENT_ITEMS.find(candidate=>`採購｜${candidate.id}`===item.task);
          if(!procurement||!procurement.track)return;
          const role=roles.find(candidate=>candidate.sheetRole===item.role);
          if(procurement.scope==='帳號'&&item.role===ACCOUNT_ROLE)state[purchaseStateKey(procurement,'account')]=Math.min(procurement.target,number(item.progress));
          else if(procurement.scope==='角色'&&role)state[purchaseStateKey(procurement,role.id)]=Math.min(procurement.target,number(item.progress));
          return;
        }
        const role=roles.find(candidate=>candidate.sheetRole===item.role);if(!role)return;
        if(item.cycle==='每日'){const index=role.daily.indexOf(item.task);if(index>=0&&!HIDDEN_DAILY_TASKS.has(item.task))state[`${role.id}-d-${index}`]=Boolean(item.complete)}
        else if(item.cycle==='每週'){const index=role.weekly.findIndex(([name])=>name===item.task);if(index>=0)state[`${role.id}-w-${index}`]=number(item.progress)}
      });
      if(accountItem)state[ACCOUNT_STATE_KEY]=Boolean(accountItem.complete);else if(legacyAccountSeen)state[ACCOUNT_STATE_KEY]=legacyAccountComplete;
      sharedWeeklySeen.forEach(task=>{state[ACCOUNT_WEEKLY_STATE_KEYS[task]]=sharedWeeklyProgress[task]||0});
      save()
    }

    async function oauthSaveItem(role,task,cycle,progress,target){

      const keyValue=`${resetDate}\u0000${role.sheetRole}\u0000${task}`;let targetIndex=-1;

      document.querySelector('#identity').innerHTML=`<strong>${role.name} <span style="color:#607487;font-weight:500">｜${role.job}</span></strong><p>倉庫分工：<b>${role.store}</b>　${role.rule}</p>`;
      document.querySelector('#focus-banner').innerHTML=focusBannerHtml();
      document.querySelectorAll('.tab').forEach(button=>button.classList.toggle('active',button.dataset.view===view));
      const [done,total]=progress();const syncLabel=oauthSignedIn()?`已登入：${oauth.user.email}`:syncReady()?'Token 備援可用':syncStatus;const stockedMaterials=MATERIAL_CATALOG.filter(item=>inventoryTotal(item.id)>0).length;
      document.querySelector('#meter-title').textContent=view==='overview'?'六角色今日進度':view==='daily'?'今日完成度':view==='weekly'?'本週完成度':view==='exchange'?'採購限購進度':view==='storage'?'材料庫存':'同步狀態';document.querySelector('#meter-label').textContent=view==='storage'?`${stockedMaterials} / ${MATERIAL_CATALOG.length} 種材料 · ${MATERIAL_CATALOG.reduce((sum,item)=>sum+inventoryTotal(item.id),0)} 件`:view==='exchange'?`${done} / ${total} 已完成`:view==='sync'?syncLabel:`${done} / ${total}`;document.querySelector('#meter-fill').style.width=view==='storage'?`${MATERIAL_CATALOG.length?stockedMaterials/MATERIAL_CATALOG.length*100:0}%`:view==='sync'?(oauthSignedIn()||syncReady()?'100%':'0%'):`${total?done/total*100:0}%`;
      document.querySelector('#date').textContent='遊戲日 '+gameDateLabel();
      const root=document.querySelector('#view');
      if(view==='overview')root.innerHTML=overviewHtml();
      if(view==='daily'){
        const dailyBlackHoleDone=Boolean(get(accountDailyBlackHoleStateKey(),false));
        const dailyBlackHoleHtml='<div class="shared-card"><div class="section-title"><h2>帳號共通每日保底</h2><small>每日 06:00 重置</small></div><div class="card"><label class="task '+(dailyBlackHoleDone?'done':'')+'"><input type="checkbox" '+(dailyBlackHoleDone?'checked':'')+' data-account-black-hole><span><span class="task-name">'+DAILY_BLACK_HOLE_TASK.label+'</span><span class="task-note">'+DAILY_BLACK_HOLE_TASK.note+'</span></span><span class="pill">帳號</span></label></div></div>';
        const groups=groupedTasks(visibleDailyTasks(role),dailyCategory).map(([category,tasks])=>'<details class="task-group" open><summary>'+escapeHtml(category)+'<small>'+tasks.filter(item=>get(active+'-d-'+item.index,false)).length+' / '+tasks.length+'</small></summary><div class="card">'+tasks.map(item=>{const checked=get(active+'-d-'+item.index,false);return '<label class="task '+(checked?'done':'')+'"><input type="checkbox" '+(checked?'checked':'')+' data-d="'+item.index+'"><span><span class="task-name">'+escapeHtml(dailyDisplayName(item.task))+'</span><span class="task-note">'+escapeHtml(dailyTaskNote(item.task))+'</span></span><span class="pill">每日</span></label>'}).join('')+'</div></details>').join('');
        root.innerHTML='<div class="section-title"><h2>今日待辦</h2><small>06:00 重置</small></div>'+dailyBlackHoleHtml+groups
      }
      if(view==='weekly'){
        const sharedWeeklyHtml='<div class="shared-card"><div class="section-title"><h2>伺服器共通</h2><small>所有角色共用</small></div><div class="card">'+ACCOUNT_WEEKLY_TASKS.map(item=>{const done=number(get(ACCOUNT_WEEKLY_STATE_KEYS[item.label],0))>=1;return '<label class="task '+(done?'done':'')+'"><input type="checkbox" '+(done?'checked':'')+' data-account-weekly="'+escapeHtml(item.label)+'"><span><span class="task-name">'+escapeHtml(item.label)+'</span><span class="task-note">'+escapeHtml(item.note)+'</span></span><span class="pill">共通</span></label>'}).join('')+'</div></div>';
        const weeklyItems=roleWeeklyItems(role,true);
        const groups=groupedTasks(weeklyItems,weeklyCategory).map(([category,tasks])=>'<details class="task-group" open><summary>'+escapeHtml(category)+'<small>'+weeklyGroupSummary(tasks,active)+'</small></summary><div class="card">'+tasks.map(item=>{
          const rawValue=number(get(active+'-w-'+item.index,0));
          const completion=isWeeklyCompletionTask(item.task);
          const value=completion?(rawValue>=item.target?item.target:0):Math.min(rawValue,item.target);
          const optional=isOptionalWeeklyTask(item.task,active);
          const status=weeklyStatus(item.task,value,item.target,active);
          const amount=completion?'':' · '+value+' / '+item.target;
          const control=completion?'<label class="week-check"><input type="checkbox" '+(value>=item.target?'checked':'')+' data-week-complete="'+item.index+'"><span>完成</span></label>':'<div class="stepper"><button aria-label="減少 '+escapeHtml(weeklyDisplayName(item.task))+'" data-step="'+item.index+'" data-delta="-1">−</button><output>'+value+'</output><button aria-label="增加 '+escapeHtml(weeklyDisplayName(item.task))+'" data-step="'+item.index+'" data-delta="1">＋</button></div>';
          const progressBar=completion?'':'<progress value="'+value+'" max="'+item.target+'"></progress>';
          return '<div class="week '+(value>=item.target?'complete ':'')+(optional?'optional':'')+'"><div><div class="week-name">'+escapeHtml(weeklyDisplayName(item.task))+'</div><small>'+escapeHtml(status)+amount+'</small></div>'+control+progressBar+'</div>'
        }).join('')+'</div></details>').join('');
        root.innerHTML='<div class="section-title"><h2>本週待辦</h2><small>週一 06:00 重置</small></div><div class="weekly-tip"><b>黑色坑洞</b>以箭頭記錄本週有效獎勵／探索次數；目前先沿用 14 次上限，這是台服玩家資料、非官方固定值，請以遊戲內顯示為準。<b>不詳的召喚結界</b>以箭頭記錄每角色本週 7 次獎勵，達到 7 次即算完成；既有次數資料會直接延續。<b>格里斯貝恩（小格）</b>與白魅魔都是每角色每週 1 次獎勵；野外首領也是每角色每週 1 次，不論挑哪一隻都只算一次。深淵相關內容分成本尊必做、分身選做。</div>'+weeklyAuditHtml()+sharedWeeklyHtml+groups+specialEventsHtml()
      }
      if(view==='exchange'){root.innerHTML=renderExchange(role);updateBarterRouteVisibility()}
      if(view==='storage')root.innerHTML=renderInventory(role);
      if(view==='sync'){
        const oauthButton=oauthConfigured()?'':'disabled';const account=oauthSignedIn()?`<div class="oauth-account">目前帳戶：<b>${escapeHtml(oauth.user.email)}</b></div>`:'<div class="oauth-account">尚未登入 Google</div>';
        root.innerHTML=`<div class="sync-panel"><h2>Google OAuth 同步</h2><p>使用固定 Google 帳號登入後，直接讀寫指定的 Google Sheet。Access Token 只保存在目前頁面的記憶體，不寫入 localStorage。</p>${account}<div class="sync-actions"><button class="primary" data-oauth-login ${oauthButton}>使用 Google 登入</button><button data-oauth-read ${oauthSignedIn()?'':'disabled'}>重新讀取 Sheets</button><button data-oauth-logout ${oauthSignedIn()?'':'disabled'}>登出</button></div><div class="sync-status">${escapeHtml(syncStatus)}</div><ol class="sync-steps"><li>在 Google Cloud 建立 Web OAuth Client ID，將 GitHub Pages 的 origin 加入 Authorized JavaScript origins。</li><li>把需要使用的 1～2 個 Google 帳號加入 OAuth 測試使用者，並將同一份 Sheet 共用給它們。</li><li>在本檔案設定 <b>GOOGLE_OAUTH_CLIENT_ID</b>；若要加強介面限制，再填入 <b>ALLOWED_GOOGLE_EMAILS</b>。</li></ol><details class="legacy-sync"><summary>備援：Token／Apps Script 同步版</summary><p>OAuth 尚未設定或暫時無法使用時，仍可使用原本的 Apps Script Web App。網址與密鑰只存於此瀏覽器。同步庫存與交換計畫前，請先更新並重新部署最新版 Code.gs。</p><label for="sync-url">Apps Script 網頁應用程式網址（/exec）</label><input id="sync-url" type="url" placeholder="https://script.google.com/macros/s/.../exec" value="${escapeHtml(syncConfig.url||'')}"><label for="sync-token">同步密鑰</label><input id="sync-token" type="password" placeholder="建立 Apps Script 時設定的密鑰" value="${escapeHtml(syncConfig.token||'')}"><div class="sync-actions"><button data-sync-save>儲存備援設定</button><button data-sync-read>從 Google Sheets 讀取</button></div></details></div>`;
      }
      document.querySelectorAll('[data-role]').forEach(button=>button.onclick=()=>{active=button.dataset.role;render()});
      document.querySelectorAll('[data-overview-go]').forEach(button=>button.onclick=()=>{active=button.dataset.overviewGo;view=button.dataset.overviewView;render()});

      document.querySelectorAll('[data-step]').forEach(button=>button.onclick=()=>{const index=Number(button.dataset.step),target=role.weekly[index][1],old=get(`${active}-w-${index}`,0),next=Math.max(0,Math.min(target,old+Number(button.dataset.delta)));set(`${active}-w-${index}`,next);syncWrite(role,role.weekly[index][0],'每週',next,target)});
      document.querySelectorAll('[data-exchange-filter]').forEach(button=>button.onclick=()=>{exchangeFilter=button.dataset.exchangeFilter;render()});
      document.querySelectorAll('[data-exchange-subview]').forEach(button=>button.onclick=()=>{exchangeSubView=button.dataset.exchangeSubview;render()});
      document.querySelectorAll('[data-exchange-scope]').forEach(button=>button.onclick=()=>{exchangeScope=button.dataset.exchangeScope;render()});
      document.querySelector('[data-exchange-pending]')?.addEventListener('click',()=>{exchangePendingOnly=!exchangePendingOnly;render()});
      document.querySelector('#barter-query')?.addEventListener('input',event=>{barterQuery=event.target.value;updateBarterRouteVisibility()});
      document.querySelectorAll('[data-barter-cycle-filter]').forEach(button=>button.onclick=()=>{barterCadenceFilter=button.dataset.barterCycleFilter;updateBarterRouteVisibility()});
      document.querySelectorAll('[data-barter-direction-filter]').forEach(button=>button.onclick=()=>{barterDirectionFilter=button.dataset.barterDirectionFilter;updateBarterRouteVisibility()});
      document.querySelectorAll('[data-plan-route]').forEach(button=>button.onclick=()=>{const route=BARTER_ROUTES.find(item=>item.id===button.dataset.planRoute);if(!route)return;const stateKey=barterPlanStateKey(route.id);const next=Math.max(0,Math.min(BARTER_PLAN_TARGET,barterPlanValue(route.id)+Number(button.dataset.delta)));state[stateKey]=next;save();syncWrite(ACCOUNT_ROLE_RECORD,'路線計畫｜'+route.id,'常駐',next,BARTER_PLAN_TARGET);render()});
      document.querySelector('[data-clear-barter-plan]')?.addEventListener('click',async()=>{const activePlans=BARTER_ROUTES.filter(route=>barterPlanValue(route.id)>0);activePlans.forEach(route=>{state[barterPlanStateKey(route.id)]=0});save();render();for(const route of activePlans)await syncWrite(ACCOUNT_ROLE_RECORD,'路線計畫｜'+route.id,'常駐',0,BARTER_PLAN_TARGET)});
      document.querySelectorAll('[data-inventory-holder]').forEach(select=>select.onchange=()=>{const holder=roles.find(role=>role.id===select.value);if(!holder)return;state[inventoryRoleKey(select.dataset.inventoryHolder)]=holder.id;save();syncWrite(ACCOUNT_ROLE_RECORD,'庫存保管｜'+select.dataset.inventoryHolder,'常駐',roles.indexOf(holder),roles.length-1);render()});
      document.querySelectorAll('[data-inventory-stock]').forEach(input=>input.onchange=()=>{const material=MATERIAL_CATALOG.find(item=>item.id===input.dataset.inventoryStock);const owner=roles.find(item=>item.id===input.dataset.inventoryRole);if(!material||!owner)return;const value=Math.max(0,Math.floor(number(input.value)));state[inventoryStateKey(material.id,owner.id)]=value;save();syncWrite(owner,'庫存｜'+material.id,'常駐',value,999999999);render()});
      document.querySelectorAll('[data-exchange-select-role]').forEach(button=>button.onclick=()=>{active=button.dataset.exchangeSelectRole;exchangeScope='role';render()});

      document.querySelectorAll('[data-purchase-step]').forEach(button=>button.onclick=()=>{const item=PROCUREMENT_ITEMS.find(candidate=>candidate.id===button.dataset.purchaseStep);if(!item)return;const currentRole=roles.find(x=>x.id===active);const stateRole=item.scope==='帳號'?'account':active;const old=purchaseValue(item,stateRole);const next=Math.max(0,Math.min(item.target,old+Number(button.dataset.delta)));set(purchaseStateKey(item,stateRole),next);syncWrite(item.scope==='帳號'?ACCOUNT_ROLE_RECORD:currentRole,purchaseTask(item),item.cycle,next,item.target)});
      document.querySelector('[data-oauth-login]')?.addEventListener('click',oauthLogin);document.querySelector('[data-oauth-read]')?.addEventListener('click',oauthRead);document.querySelector('[data-oauth-logout]')?.addEventListener('click',logoutOAuth);
      document.querySelector('[data-sync-save]')?.addEventListener('click',()=>{syncConfig.url=document.querySelector('#sync-url').value.trim();syncConfig.token=document.querySelector('#sync-token').value.trim();localStorage.setItem(syncKey,JSON.stringify(syncConfig));syncStatus=syncReady()?'備援同步設定已儲存':'請完整填入備援網址與密鑰';render()});document.querySelector('[data-sync-read]')?.addEventListener('click',syncReadLegacy);
      document.querySelectorAll('#view input[type="checkbox"]').forEach(checkbox=>checkbox.onclick=handleCheckboxClick);
    }
    function handleCheckboxClick(event){
      const checkbox=event.currentTarget;
      if(!checkbox||checkbox.type!=='checkbox'||!document.querySelector('#view')?.contains(checkbox))return;
      const checked=checkbox.checked;
      const currentRole=roles.find(role=>role.id===active);
      if(checkbox.matches('[data-d]')){
        const index=Number(checkbox.dataset.d),task=currentRole.daily[index];
        if(!task)return;
        setCheckboxState(`${active}-d-${index}`,checked);
        syncWrite(currentRole,task,'每日',checked?1:0,1);
        return
      }
      if(checkbox.matches('[data-account-black-hole]')){
        setCheckboxState(accountDailyBlackHoleStateKey(),checked);
        syncWrite(ACCOUNT_ROLE_RECORD,DAILY_BLACK_HOLE_TASK.sheetTask,'每日',checked?1:0,1);
        return
      }
      if(checkbox.matches('[data-account-weekly]')){
        const task=ACCOUNT_WEEKLY_TASKS.find(item=>item.label===checkbox.dataset.accountWeekly);
        if(!task)return;
        setCheckboxState(ACCOUNT_WEEKLY_STATE_KEYS[task.label],checked?1:0);
        syncWrite(ACCOUNT_ROLE_RECORD,task.label,'每週',checked?1:0,1);
        return
      }
      if(checkbox.matches('[data-week-complete]')){
        const index=Number(checkbox.dataset.weekComplete),task=currentRole.weekly[index];
        if(!task)return;
        const next=checked?task[1]:0;
        setCheckboxState(active+'-w-'+index,next);
        syncWrite(currentRole,task[0],'每週',next,task[1]);
        return
      }
      if(checkbox.matches('[data-purchase-check]')){
        const item=PROCUREMENT_ITEMS.find(candidate=>candidate.id===checkbox.dataset.purchaseCheck);
        if(!item)return;
        const roleForSync=item.scope==='帳號'?ACCOUNT_ROLE_RECORD:currentRole;
        const stateRole=item.scope==='帳號'?'account':active;
        setCheckboxState(purchaseStateKey(item,stateRole),checked?1:0);
        syncWrite(roleForSync,purchaseTask(item),item.cycle,checked?1:0,item.target)
      }
    }
    document.querySelectorAll('.tab').forEach(button=>button.onclick=()=>{view=button.dataset.view;render()});
    render();
    scheduleGameDayRefresh();
  </script>
</body>
</html>
