<!doctype html>
<html lang="zh-Hant">
<head>

  <title>瑪奇 Mobile｜日週清單</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23102d45'/%3E%3Cpath d='M18 34l9 9 19-22' fill='none' stroke='%23dcecff' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <style>
    :root { --navy:#102d45; --blue:#1e5d8f; --ice:#e6f2fb; --paper:#f6f9fc; --ink:#183145; --muted:#607487; --line:#d7e3ed; --mint:#e9f6ef; --mint-ink:#176043; --amber:#fff4d7; --amber-ink:#815400; }
    * { box-sizing:border-box; }
    body { margin:0; background:linear-gradient(150deg,#eaf3f9 0%,#f7fafc 43%,#e7f0f6 100%); color:var(--ink); font:16px/1.45 system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif; min-height:100vh; }
    button,input { font:inherit; }
    .app { max-width:780px; margin:0 auto; min-height:100vh; background:var(--paper); box-shadow:0 0 50px #3150661b; }
    header { background:var(--navy); color:white; padding:1.15rem 1rem 1rem; }
    .topline { display:flex; justify-content:space-between; align-items:start; gap:1rem; }
    h1 { margin:0; font-size:1.2rem; letter-spacing:.02em; }
    .date { color:#d4e6f5; font-size:.82rem; white-space:nowrap; }
    .sub { color:#bfd4e6; margin:.32rem 0 0; font-size:.82rem; }
    .rolebar { display:flex; gap:.5rem; overflow:auto; padding:.8rem 1rem .7rem; background:white; border-bottom:1px solid var(--line); scrollbar-width:none; }
    .rolebar::-webkit-scrollbar { display:none; }
    .role { border:1px solid var(--line); background:#fff; color:#456176; border-radius:999px; padding:.44rem .72rem; white-space:nowrap; cursor:pointer; font-size:.85rem; }
    .role.active { border-color:var(--blue); background:var(--blue); color:white; font-weight:700; }
    main { padding:1rem; padding-bottom:2rem; }
    .identity { background:var(--ice); border:1px solid #cfe1ef; border-radius:14px; padding:.8rem .9rem; margin-bottom:.8rem; }
    .identity strong { font-size:1.02rem; }
    .identity p { margin:.22rem 0 0; font-size:.84rem; color:#35556d; }
    .focus-banner { display:flex; justify-content:space-between; gap:.7rem; align-items:center; padding:.68rem .85rem; margin-bottom:.8rem; background:#fffdf4; border:1px solid #eadcae; border-radius:12px; color:#68552b; }
    .focus-banner strong { font-size:.86rem; }
    .focus-banner small { color:#816f45; font-size:.76rem; text-align:right; }
    .role-marker { margin-bottom:.8rem; }
    .role-marker .task { background:#eef6fb; }
    .special-event .task { background:#fffaf0; }
    .weekly-audit .task { min-height:0; }
    .audit-item { display:flex; justify-content:space-between; gap:.8rem; padding:.65rem .8rem; border-bottom:1px solid #e8eff4; font-size:.82rem; }
    .audit-item:last-child { border-bottom:0; }

    .week.optional { background:#fbfcfd; }
    .week.optional .week-name { color:#607487; }
    .week-check { display:flex; align-items:center; gap:.4rem; color:#47677d; font-size:.78rem; cursor:pointer; }

    .meter { display:grid; grid-template-columns:1fr auto; gap:.5rem 1rem; align-items:center; background:#fff; border:1px solid var(--line); border-radius:14px; padding:.8rem .9rem; margin-bottom:1rem; }
    .meter b { font-size:.9rem; } .meter span { color:var(--muted); font-size:.83rem; }
    .track { grid-column:1/-1; height:7px; background:#e3edf4; overflow:hidden; border-radius:99px; } .fill { height:100%; background:linear-gradient(90deg,#2170a8,#4a9ccd); border-radius:99px; transition:width .2s; }

    .tabs { display:grid; grid-template-columns:repeat(auto-fit,minmax(5.4rem,1fr)); gap:.36rem; padding:.34rem; background:#e5edf3; border-radius:12px; margin-bottom:.55rem; }
    .tab { min-width:0; border:0; background:transparent; color:#5a7081; padding:.53rem .2rem; border-radius:9px; cursor:pointer; font-weight:700; font-size:.9rem; white-space:nowrap; }
    .tab.active { background:white; color:var(--navy); box-shadow:0 1px 3px #18314519; }
    .tool-nav { display:grid; grid-template-columns:auto 1fr; align-items:center; gap:.65rem; margin-bottom:1rem; padding:.45rem .55rem; border:1px solid #b9d2e3; border-radius:12px; background:#edf6fc; }
    .tool-nav-label { padding:0 .25rem; color:#527083; font-size:.72rem; font-weight:800; white-space:nowrap; }
    .tool-tab { display:flex; justify-content:space-between; align-items:center; gap:.5rem; width:100%; min-width:0; padding:.55rem .7rem; border:1px solid transparent; border-radius:9px; background:transparent; color:#31566d; text-align:left; cursor:pointer; }
    .tool-tab span:first-child { display:grid; gap:.05rem; }
    .tool-tab b { font-size:.86rem; }
    .tool-tab small { color:#607487; font-size:.7rem; font-weight:500; }
    .tool-tab .tool-arrow { flex:0 0 auto; font-size:.8rem; font-weight:800; }
    .tool-tab.active { border-color:#9ec1d9; background:#fff; color:var(--navy); box-shadow:0 1px 3px #18314519; }
    .section-title { display:flex; justify-content:space-between; align-items:center; margin:.2rem 0 .5rem; } .section-title h2 { margin:0; font-size:1rem; } .section-title small { color:var(--muted); }
    .card { background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; }
    .task { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:.7rem; min-height:3.85rem; padding:.65rem .8rem; border-bottom:1px solid #e8eff4; cursor:pointer; touch-action:manipulation; }
    .task:last-child { border-bottom:0; } .task.done .task-name { color:#8294a2; text-decoration:line-through; }
    .task input[type=checkbox],
    .week-check input[type=checkbox],
    .exchange-control input[type=checkbox] { appearance:none; -webkit-appearance:none; width:1.2rem; height:1.2rem; border:2px solid #8fa8ba; border-radius:5px; display:grid; place-content:center; cursor:pointer; pointer-events:auto; margin:0; background:#fff; transition:background-color .12s,border-color .12s; }
    .task input[type=checkbox]::before,
    .week-check input[type=checkbox]::before,
    .exchange-control input[type=checkbox]::before { content:""; width:.55rem; height:.3rem; border-left:2px solid white; border-bottom:2px solid white; transform:rotate(-45deg) scale(0); margin-top:-.13rem; }
    .task input[type=checkbox]:checked,
    .week-check input[type=checkbox]:checked,
    .exchange-control input[type=checkbox]:checked { background:#2170a8; border-color:#2170a8; }
    .task input[type=checkbox]:checked::before,
    .week-check input[type=checkbox]:checked::before,
    .exchange-control input[type=checkbox]:checked::before { transform:rotate(-45deg) scale(1); }
    .task input[type=checkbox]:focus-visible,
    .week-check input[type=checkbox]:focus-visible,
    .exchange-control input[type=checkbox]:focus-visible { outline:3px solid #83b9de; outline-offset:2px; }
    .task-name { font-weight:650; font-size:.94rem; } .task-note { color:var(--muted); font-size:.76rem; margin-top:.08rem; }
    .pill { background:#eef5fa; color:#47677d; font-size:.73rem; padding:.22rem .45rem; border-radius:99px; white-space:nowrap; }
    .week { display:grid; grid-template-columns:1fr auto; gap:.5rem .8rem; padding:.78rem .8rem; border-bottom:1px solid #e8eff4; align-items:center; } .week:last-child { border:0; }
    .week-name { font-weight:650; font-size:.94rem; } .week small { color:var(--muted); }
    .stepper { display:flex; align-items:center; border:1px solid #cbdbe6; border-radius:9px; overflow:hidden; background:white; } .stepper button { border:0; background:#eef5fa; color:#245675; min-width:2rem; min-height:2rem; cursor:pointer; font-weight:800; } .stepper output { min-width:2.45rem; text-align:center; font-weight:750; font-size:.9rem; }
    .week progress { grid-column:1/-1; width:100%; height:7px; accent-color:#2c82b9; } .week.complete { background:var(--mint); } .week.complete .week-name { color:var(--mint-ink); }
    .task-group { margin-bottom:.75rem; }
    .task-group:last-child { margin-bottom:0; }
    .task-group summary { list-style:none; display:flex; justify-content:space-between; align-items:center; cursor:pointer; padding:.68rem .8rem; background:#edf4f8; border:1px solid var(--line); border-radius:12px 12px 0 0; color:#31566d; font-weight:750; font-size:.86rem; }
    .task-group summary::-webkit-details-marker { display:none; }
    .task-group summary::after { content:'⌄'; color:#6d8494; font-size:1rem; transform:rotate(0deg); transition:transform .15s; }
    .task-group:not([open]) summary { border-radius:12px; }
    .task-group:not([open]) summary::after { transform:rotate(-90deg); }
    .task-group .card { border-top:0; border-radius:0 0 12px 12px; }
    .shared-card { margin-bottom:.8rem; }
    .shared-card .task { background:#fffaf0; }
    .shared-card .task-name { color:#704d00; }
    .shared-card .pill { background:#fff0c7; color:#815400; }
    .exchange-intro, .exchange-empty { background:white; border:1px solid var(--line); border-radius:14px; padding:1rem; }
    .exchange-intro { margin-bottom:.8rem; background:#eef6fb; border-color:#cfe1ef; }
    .exchange-intro h3, .exchange-empty h3 { margin:0 0 .3rem; font-size:.98rem; }
    .exchange-intro p, .exchange-empty p { margin:.25rem 0 0; color:#486476; font-size:.84rem; }

    .exchange-alert b { display:block; margin-bottom:.15rem; color:#624600; }
    .exchange-filters { display:flex; gap:.45rem; overflow:auto; padding:.15rem 0 .75rem; scrollbar-width:none; }
    .exchange-filters::-webkit-scrollbar { display:none; }
    .exchange-filter { flex:0 0 auto; border:1px solid var(--line); border-radius:999px; padding:.38rem .65rem; background:white; color:#527083; cursor:pointer; font-size:.8rem; font-weight:700; }
    .exchange-filter.active { border-color:var(--blue); background:var(--blue); color:white; }

    .exchange-scope-note { margin:0 0 .65rem; color:#607487; font-size:.74rem; }
    .exchange-region { margin-bottom:.75rem; }
    .exchange-region:last-child { margin-bottom:0; }
    .exchange-region-heading { display:flex; justify-content:space-between; align-items:center; margin:0; padding:.62rem .75rem; border:1px solid var(--line); border-bottom:0; border-radius:12px 12px 0 0; background:#edf4f8; color:#31566d; font-size:.86rem; }
    .exchange-region-heading small { color:#6d8494; font-size:.74rem; font-weight:500; }
    .exchange-region-content { padding:.42rem; border:1px solid var(--line); border-radius:0 0 12px 12px; background:#f7fafc; }
    .exchange-vendor { overflow:hidden; border:1px solid var(--line); border-radius:10px; background:white; }
    .exchange-vendor + .exchange-vendor { margin-top:.42rem; }
    .exchange-vendor-heading { display:flex; justify-content:space-between; align-items:center; gap:.5rem; margin:0; padding:.52rem .68rem; border-bottom:1px solid #e8eff4; color:#31566d; font-size:.82rem; }
    .exchange-vendor-heading small { color:#6d8494; font-size:.71rem; font-weight:500; text-align:right; }
    .exchange-list { background:white; border:1px solid var(--line); border-radius:0 0 12px 12px; overflow:hidden; }
    .exchange-card { display:grid; grid-template-columns:1fr auto; gap:.65rem; align-items:center; padding:.78rem .75rem; border-bottom:1px solid #e8eff4; }
    .exchange-card:last-child { border-bottom:0; }
    .exchange-card-all { display:block; }
    .exchange-card.done { background:var(--mint); }
    .exchange-card.done .exchange-product { color:var(--mint-ink); }
    .exchange-product { font-weight:750; font-size:.9rem; }
    .exchange-route { margin-top:.12rem; color:#486476; font-size:.78rem; }
    .exchange-role-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.35rem; margin-top:.55rem; }
    .exchange-role-progress { display:flex; justify-content:space-between; align-items:center; gap:.35rem; min-width:0; padding:.38rem .48rem; border:1px solid #d7e3ed; border-radius:8px; background:#f7fafc; color:#527083; cursor:pointer; text-align:left; font-size:.7rem; font-weight:650; }
    .exchange-role-progress:hover { border-color:#95b9d1; }
    .exchange-role-progress span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .exchange-role-progress b { flex:none; font-size:.68rem; white-space:nowrap; }
    .exchange-role-progress.done { border-color:#c8e4d4; background:var(--mint); color:var(--mint-ink); }
    .exchange-meta { display:flex; flex-wrap:wrap; gap:.3rem; margin-top:.38rem; }
    .exchange-meta span, .evidence { display:inline-block; padding:.18rem .38rem; border-radius:999px; background:#eef5fa; color:#47677d; font-size:.7rem; }
    .evidence.official { background:#e7f5ed; color:#176043; }
    .evidence.player { background:#fff0c7; color:#815400; }
    .exchange-control { justify-self:end; }

    .exchange-control .stepper { margin-left:auto; }
    .exchange-note { grid-column:1/-1; margin-top:-.2rem; color:#6d8494; font-size:.75rem; }
    .exchange-note input[type="number"] { width:4.2rem; padding:.35rem; border:1px solid #b8cbd9; border-radius:7px; color:var(--ink); background:#fff; }
    .exchange-source { margin-top:.8rem; padding:.78rem .8rem; border:1px solid var(--line); border-radius:12px; background:#fff; color:#486476; font-size:.78rem; }
    .procurement-guide { display:grid; gap:.55rem; margin:.8rem 0; }
    .procurement-guide-card { padding:.72rem .78rem; border:1px solid var(--line); border-radius:12px; background:#fff; font-size:.8rem; }
    .procurement-guide-card.priority { background:#fffaf0; border-color:#eadcae; }
    .procurement-guide-card.recommend { background:#eef6fb; border-color:#cfe1ef; }
    .procurement-guide-card.reference { background:#f7fafc; }
    .procurement-guide-card h4 { margin:0; color:#31566d; font-size:.86rem; }
    .procurement-guide-card p { margin:.25rem 0 0; color:#486476; }
    .procurement-guide-card a { display:inline-block; margin-top:.35rem; color:#1e5d8f; font-size:.74rem; }
    .external-tool-grid { display:grid; grid-template-columns:1fr; gap:.55rem; margin-top:.6rem; }
    .external-tool-card { min-width:0; padding:.68rem .72rem; border:1px solid var(--line); border-radius:10px; background:#f8fbfd; }
    .external-tool-card h4 { margin:.25rem 0 0; font-size:.84rem; }
    .external-tool-card h4 a { color:#1e5d8f; text-decoration:none; }
    .external-tool-card h4 a:hover { text-decoration:underline; }
    .external-tool-card p { margin:.28rem 0 0; color:#486476; font-size:.75rem; line-height:1.5; }
    .external-tool-category { color:#6d8494; font-size:.67rem; font-weight:700; letter-spacing:.02em; }

    .evidence.limited { background:#eef5fa; color:#47677d; }

    .exchange-source p { margin:.5rem 0 0; }

    .exchange-source a { color:#1e5d8f; }

    .material-chip { padding:.24rem .45rem; border:1px solid #d4e2eb; border-radius:999px; background:#f7fafc; color:#527083; font-size:.72rem; }

    .barter-filter-button.active { border-color:var(--blue); background:var(--blue); color:white; }
    .barter-result-count { margin:.48rem 0 .38rem; color:#607487; font-size:.72rem; }

    function millisecondsUntilGameReset(){
      const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Taipei',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric',hourCycle:'h23'}).formatToParts(new Date());
      const values=Object.fromEntries(parts.filter(part=>part.type!=='literal').map(part=>[part.type,Number(part.value)]));
      const current=Date.UTC(values.year,values.month-1,values.day,values.hour,values.minute,values.second);
      const todayReset=Date.UTC(values.year,values.month-1,values.day,6);
      const nextReset=current<todayReset?todayReset:Date.UTC(values.year,values.month-1,values.day+1,6);
      return Math.max(1000,nextReset-current+500)
    }

    function updatePitProgress(role,change,fromDaily=false){
      const dailyKey=dailyTaskStateKey(role.id,DAILY_BLACK_HOLE_TASK.id);
      const weeklyKey=weeklyTaskStateKey(role.id,'黑色坑洞');
      const linkKey=pitDailyLinkedKey(role.id);
      const previous=Math.max(0,Math.min(14,number(get(weeklyKey,0))));
      const wasDaily=Boolean(get(dailyKey,false));
      const wasLinked=Boolean(get(linkKey,false));
      let next=Math.max(0,Math.min(14,previous+change));
      if(change>0&&next===previous){render();return}
      if(change<0&&next===previous&&!fromDaily){render();return}
      if(fromDaily){
        state[dailyKey]=change>0;
        state[linkKey]=change>0;
        if(change<0&&!wasLinked)next=previous;
      }else if(change>0&&!get(dailyKey,false)){
        state[dailyKey]=true;state[linkKey]=true;
      }else if(change>0&&wasDaily&&!wasLinked&&previous===0){
        state[linkKey]=true;
      }else if(change<0&&next===0&&get(linkKey,false)){
        state[dailyKey]=false;state[linkKey]=false;
      }
      state[weeklyKey]=next;save();render();
      syncWrite(role,'黑色坑洞','每週',next,14);
      if(Boolean(state[dailyKey])!==wasDaily){
        syncWrite(role,DAILY_BLACK_HOLE_TASK.sheetTask,'每日',state[dailyKey]?1:0,1)
      }
    }

      document.querySelectorAll('[data-barter-direction-filter]').forEach(button=>button.onclick=()=>{barterDirectionFilter=button.dataset.barterDirectionFilter;updateBarterRouteVisibility()});
      document.querySelectorAll('[data-plan-route]').forEach(button=>button.onclick=()=>{const route=BARTER_ROUTES.find(item=>item.id===button.dataset.planRoute);if(!route)return;const stateKey=barterPlanStateKey(route.id);const next=Math.max(0,Math.min(BARTER_PLAN_TARGET,barterPlanValue(route.id)+Number(button.dataset.delta)));state[stateKey]=next;save();syncWrite(ACCOUNT_ROLE_RECORD,'路線計畫｜'+route.id,'常駐',next,BARTER_PLAN_TARGET);render()});
      document.querySelector('[data-clear-barter-plan]')?.addEventListener('click',async()=>{const activePlans=BARTER_ROUTES.filter(route=>barterPlanValue(route.id)>0);activePlans.forEach(route=>{state[barterPlanStateKey(route.id)]=0});save();render();for(const route of activePlans)await syncWrite(ACCOUNT_ROLE_RECORD,'路線計畫｜'+route.id,'常駐',0,BARTER_PLAN_TARGET)});
      document.querySelectorAll('[data-inventory-stock]').forEach(input=>input.onchange=()=>{
        const material=MATERIAL_CATALOG.find(item=>item.id===input.dataset.inventoryStock);
        const owner=roles.find(item=>item.id===input.dataset.inventoryRole);
        if(!material||!owner)return;
        const value=Math.max(0,Math.floor(number(input.value)));
        input.value=String(value);
        state[inventoryStateKey(material.id,owner.id)]=value;
        save();
        syncWrite(owner,'庫存｜'+material.id,'常駐',value,999999999);
        const total=inventoryTotal(material.id);
        document.querySelectorAll('[data-inventory-total]').forEach(node=>{if(node.dataset.inventoryTotal===material.id)node.textContent='六倉合計 '+total});
        roles.forEach(lineOwner=>{
          const lineItems=MATERIAL_CATALOG.filter(item=>item.defaultRole===lineOwner.id);
          const lineTotal=lineItems.reduce((sum,item)=>sum+inventoryTotal(item.id),0);
          document.querySelectorAll('[data-inventory-group-total]').forEach(node=>{if(node.dataset.inventoryGroupTotal===lineOwner.id)node.textContent='管理 '+lineItems.length+' 種 · 六倉共 '+lineTotal});
        });
        const totalItems=MATERIAL_CATALOG.filter(item=>inventoryTotal(item.id)>0).length;
        const totalUnits=MATERIAL_CATALOG.reduce((sum,item)=>sum+inventoryTotal(item.id),0);
        const summary=document.querySelector('#inventory-summary');
        if(summary)summary.textContent=totalItems+' / '+MATERIAL_CATALOG.length+' 項已登記 · 六倉 '+totalUnits+' 件';
        const meterLabel=document.querySelector('#meter-label');
        if(view==='storage'&&meterLabel)meterLabel.textContent=totalItems+' / '+MATERIAL_CATALOG.length+' 種材料 · '+totalUnits+' 件';
        const meterFill=document.querySelector('#meter-fill');
        if(view==='storage'&&meterFill)meterFill.style.width=(MATERIAL_CATALOG.length?totalItems/MATERIAL_CATALOG.length*100:0)+'%';
      });
      document.querySelectorAll('[data-exchange-select-role]').forEach(button=>button.onclick=()=>{active=button.dataset.exchangeSelectRole;exchangeScope='role';render()});

      document.querySelectorAll('[data-purchase-step]').forEach(button=>button.onclick=()=>{const item=PROCUREMENT_ITEMS.find(candidate=>candidate.id===button.dataset.purchaseStep);if(!item)return;const currentRole=roles.find(x=>x.id===active);const stateRole=item.scope==='帳號'?'account':active;const syncRole=item.scope==='帳號'?ACCOUNT_ROLE_RECORD:currentRole;const old=purchaseValue(item,stateRole);const next=Math.max(0,Math.min(item.target,old+Number(button.dataset.delta)));state[purchaseStateKey(item,stateRole)]=next;if(item.cycle==='每週'&&next>purchasePlan(item,stateRole)){state[purchasePlanKey(item,stateRole)]=next;syncWrite(syncRole,'採購計畫｜'+item.id,'每週',next,item.target)}save();render();syncWrite(syncRole,purchaseTask(item),item.cycle,next,item.target)});
      document.querySelectorAll('[data-purchase-plan]').forEach(input=>input.onchange=()=>{const item=PROCUREMENT_ITEMS.find(candidate=>candidate.id===input.dataset.purchasePlan);if(!item||item.cycle!=='每週')return;const stateRole=item.scope==='帳號'?'account':active;const next=Math.max(0,Math.min(item.target,Math.floor(number(input.value))));state[purchasePlanKey(item,stateRole)]=next;save();render();syncWrite(item.scope==='帳號'?ACCOUNT_ROLE_RECORD:role,'採購計畫｜'+item.id,'每週',next,item.target)});
      document.querySelector('[data-oauth-login]')?.addEventListener('click',oauthLogin);document.querySelector('[data-oauth-read]')?.addEventListener('click',oauthRead);document.querySelector('[data-oauth-logout]')?.addEventListener('click',logoutOAuth);
      document.querySelector('[data-sync-save]')?.addEventListener('click',()=>{syncConfig.url=document.querySelector('#sync-url').value.trim();syncConfig.token=document.querySelector('#sync-token').value.trim();localStorage.setItem(syncKey,JSON.stringify(syncConfig));syncStatus=syncReady()?'備援同步設定已儲存':'請完整填入備援網址與密鑰';render()});document.querySelector('[data-sync-read]')?.addEventListener('click',syncReadLegacy);
      document.querySelectorAll('#view input[type="checkbox"]').forEach(checkbox=>checkbox.onclick=handleCheckboxClick);
    }
    function handleCheckboxClick(event){
      const checkbox=event.currentTarget;
      if(!checkbox||checkbox.type!=='checkbox'||!document.querySelector('#view')?.contains(checkbox))return;
      const checked=checkbox.checked;
      const currentRole=roles.find(role=>role.id===active);
      if(checkbox.matches('[data-daily-task]')){
        const item=visibleDailyTasks(currentRole).find(candidate=>candidate.id===checkbox.dataset.dailyTask);
        if(!item)return;
        if(item.id===DAILY_BLACK_HOLE_TASK.id){updatePitProgress(currentRole,checked?1:-1,true);return}
        setCheckboxState(dailyTaskStateKey(active,item.id),checked);
        syncWrite(currentRole,item.task,'每日',checked?1:0,1);
        return
      }
      if(checkbox.matches('[data-account-weekly]')){
        const task=ACCOUNT_WEEKLY_TASKS.find(item=>item.label===checkbox.dataset.accountWeekly);
        if(!task)return;
        setCheckboxState(ACCOUNT_WEEKLY_STATE_KEYS[task.label],checked?1:0);
        syncWrite(ACCOUNT_ROLE_RECORD,task.label,'每週',checked?1:0,1);
        return
      }
      if(checkbox.matches('[data-week-complete]')){
        const entry=currentRole.weekly.find(([task])=>taskIdFor('每週',task)===checkbox.dataset.weekComplete);
        if(!entry)return;
        const [task,target]=entry;const next=checked?target:0;
        setCheckboxState(weeklyTaskStateKey(active,task),next);
        syncWrite(currentRole,task,'每週',next,target);
        return
      }
      if(checkbox.matches('[data-purchase-check]')){
        const item=PROCUREMENT_ITEMS.find(candidate=>candidate.id===checkbox.dataset.purchaseCheck);
        if(!item)return;
        const roleForSync=item.scope==='帳號'?ACCOUNT_ROLE_RECORD:currentRole;
        const stateRole=item.scope==='帳號'?'account':active;
        if(checked&&item.cycle==='每週'&&purchasePlan(item,stateRole)<1){state[purchasePlanKey(item,stateRole)]=1;syncWrite(roleForSync,'採購計畫｜'+item.id,'每週',1,item.target)}
        setCheckboxState(purchaseStateKey(item,stateRole),checked?1:0);
        syncWrite(roleForSync,purchaseTask(item),item.cycle,checked?1:0,item.target)
      }
    }
    document.querySelectorAll('[data-view]').forEach(button=>button.onclick=()=>{view=button.dataset.view;render()});
    render();
    scheduleGameDayRefresh();
  </script>
</body>
</html>
