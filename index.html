<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#102d45" />
  <title>瑪奇 Mobile｜日週清單</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23102d45'/%3E%3Cpath d='M18 34l9 9 19-22' fill='none' stroke='%23dcecff' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <style>
    :root { --navy:#102d45; --blue:#1e5d8f; --ice:#e6f2fb; --paper:#f6f9fc; --ink:#183145; --muted:#607487; --line:#d7e3ed; --mint:#e9f6ef; --mint-ink:#176043; --amber:#fff4d7; --amber-ink:#815400; }
    * { box-sizing:border-box; }
    body { margin:0; background:linear-gradient(150deg,#eaf3f9 0%,#f7fafc 43%,#e7f0f6 100%); color:var(--ink); font:16px/1.45 system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif; min-height:100vh; }
    button,input { font:inherit; }
    .app { max-width:780px; margin:0 auto; min-height:100vh; background:var(--paper); box-shadow:0 0 50px #3150661b; }
    header { background:var(--navy); color:white; padding:1.15rem 1rem 1rem; }
    .topline { display:flex; justify-content:space-between; align-items:start; gap:1rem; }
    h1 { margin:0; font-size:1.2rem; letter-spacing:.02em; }
    .date { color:#d4e6f5; font-size:.82rem; white-space:nowrap; }
    .sub { color:#bfd4e6; margin:.32rem 0 0; font-size:.82rem; }
    .rolebar { display:flex; gap:.5rem; overflow:auto; padding:.8rem 1rem .7rem; background:white; border-bottom:1px solid var(--line); scrollbar-width:none; }
    .rolebar::-webkit-scrollbar { display:none; }
    .role { border:1px solid var(--line); background:#fff; color:#456176; border-radius:999px; padding:.44rem .72rem; white-space:nowrap; cursor:pointer; font-size:.85rem; }
    .role.active { border-color:var(--blue); background:var(--blue); color:white; font-weight:700; }
    main { padding:1rem; padding-bottom:2rem; }
    .identity { background:var(--ice); border:1px solid #cfe1ef; border-radius:14px; padding:.8rem .9rem; margin-bottom:.8rem; }
    .identity strong { font-size:1.02rem; }
    .identity p { margin:.22rem 0 0; font-size:.84rem; color:#35556d; }
    .meter { display:grid; grid-template-columns:1fr auto; gap:.5rem 1rem; align-items:center; background:#fff; border:1px solid var(--line); border-radius:14px; padding:.8rem .9rem; margin-bottom:1rem; }
    .meter b { font-size:.9rem; } .meter span { color:var(--muted); font-size:.83rem; }
    .track { grid-column:1/-1; height:7px; background:#e3edf4; overflow:hidden; border-radius:99px; } .fill { height:100%; background:linear-gradient(90deg,#2170a8,#4a9ccd); border-radius:99px; transition:width .2s; }
    .tabs { display:grid; grid-template-columns:repeat(4,1fr); gap:.36rem; padding:.34rem; background:#e5edf3; border-radius:12px; margin-bottom:1rem; }
    .tab { border:0; background:transparent; color:#5a7081; padding:.53rem .2rem; border-radius:9px; cursor:pointer; font-weight:700; font-size:.9rem; }
    .tab.active { background:white; color:var(--navy); box-shadow:0 1px 3px #18314519; }
    .section-title { display:flex; justify-content:space-between; align-items:center; margin:.2rem 0 .5rem; } .section-title h2 { margin:0; font-size:1rem; } .section-title small { color:var(--muted); }
    .card { background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; }
    .task { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:.7rem; min-height:3.85rem; padding:.65rem .8rem; border-bottom:1px solid #e8eff4; }
    .task:last-child { border-bottom:0; } .task.done .task-name { color:#8294a2; text-decoration:line-through; }
    .task input[type=checkbox] { appearance:none; width:1.2rem; height:1.2rem; border:2px solid #8fa8ba; border-radius:5px; display:grid; place-content:center; cursor:pointer; margin:0; }
    .task input[type=checkbox]::before { content:""; width:.55rem; height:.3rem; border-left:2px solid white; border-bottom:2px solid white; transform:rotate(-45deg) scale(0); margin-top:-.13rem; } .task input:checked { background:#2170a8; border-color:#2170a8; } .task input:checked::before { transform:rotate(-45deg) scale(1); }
    .task-name { font-weight:650; font-size:.94rem; } .task-note { color:var(--muted); font-size:.76rem; margin-top:.08rem; }
    .pill { background:#eef5fa; color:#47677d; font-size:.73rem; padding:.22rem .45rem; border-radius:99px; white-space:nowrap; }
    .week { display:grid; grid-template-columns:1fr auto; gap:.5rem .8rem; padding:.78rem .8rem; border-bottom:1px solid #e8eff4; align-items:center; } .week:last-child { border:0; }
    .week-name { font-weight:650; font-size:.94rem; } .week small { color:var(--muted); }
    .stepper { display:flex; align-items:center; border:1px solid #cbdbe6; border-radius:9px; overflow:hidden; background:white; } .stepper button { border:0; background:#eef5fa; color:#245675; min-width:2rem; min-height:2rem; cursor:pointer; font-weight:800; } .stepper output { min-width:2.45rem; text-align:center; font-weight:750; font-size:.9rem; }
    .week progress { grid-column:1/-1; width:100%; height:7px; accent-color:#2c82b9; } .week.complete { background:var(--mint); } .week.complete .week-name { color:var(--mint-ink); }
    .warehouse { display:grid; grid-template-columns:auto 1fr; gap:.75rem; align-items:start; padding:1rem; background:white; border:1px solid var(--line); border-radius:14px; } .warehouse-icon { width:2.4rem; height:2.4rem; display:grid; place-items:center; border-radius:10px; background:#edf4f8; font-size:1.25rem; } .warehouse h2 { margin:0; font-size:1rem; } .warehouse p { margin:.25rem 0 0; color:#486476; font-size:.87rem; } .warehouse .rule { grid-column:1/-1; border-radius:9px; padding:.65rem .72rem; background:var(--amber); color:var(--amber-ink); font-size:.82rem; }
    .warehouse-list { margin-top:.8rem; background:white; border:1px solid var(--line); border-radius:14px; overflow:hidden; } .warehouse-list div { padding:.72rem .85rem; border-bottom:1px solid #e8eff4; font-size:.88rem; } .warehouse-list div:last-child { border:0; } .warehouse-list b { display:block; margin-bottom:.12rem; } .warehouse-list span { color:var(--muted); font-size:.79rem; }
    .sync-panel { background:white; border:1px solid var(--line); border-radius:14px; padding:1rem; }
    .sync-panel h2 { margin:0 0 .35rem; font-size:1rem; } .sync-panel p { margin:.3rem 0 .8rem; color:#486476; font-size:.84rem; }
    .sync-panel label { display:block; margin:.7rem 0 .25rem; font-size:.8rem; color:#486476; font-weight:700; }
    .sync-panel input { width:100%; border:1px solid #cbdbe6; border-radius:8px; padding:.6rem .65rem; color:var(--ink); background:#fbfdff; }
    .sync-actions { display:flex; gap:.5rem; flex-wrap:wrap; margin-top:.85rem; }
    .sync-actions button { border:1px solid #b7cddd; border-radius:8px; padding:.55rem .75rem; cursor:pointer; background:#eef5fa; color:#245675; font-weight:700; }
    .sync-actions button.primary { background:#2170a8; color:white; border-color:#2170a8; }
    .sync-status { margin-top:.75rem; padding:.6rem .7rem; border-radius:8px; background:#f2f7fa; color:#486476; font-size:.8rem; }
    .sync-steps { margin:.8rem 0 0; padding-left:1.2rem; color:#486476; font-size:.82rem; }
    .hint { color:var(--muted); font-size:.76rem; text-align:center; margin:1rem 0 0; }
    @media (min-width:700px) { main { padding:1.25rem 1.5rem 2.5rem; } header { padding:1.35rem 1.5rem; } .rolebar { padding-left:1.5rem; padding-right:1.5rem; } }
  </style>
</head>
<body>
  <div class="app">
    <header><div class="topline"><div><h1>瑪奇 Mobile｜日週清單</h1><p class="sub">六角色 · 每日／每週 · 材料倉庫分工</p></div><div class="date" id="date"></div></div></header>
    <nav class="rolebar" id="rolebar" aria-label="選擇角色"></nav>
    <main>
      <section class="identity" id="identity"></section>
      <section class="meter"><b id="meter-title">今日完成度</b><span id="meter-label"></span><div class="track"><div class="fill" id="meter-fill"></div></div></section>
      <nav class="tabs" aria-label="檢視"><button class="tab active" data-view="daily">今日</button><button class="tab" data-view="weekly">本週</button><button class="tab" data-view="storage">倉庫</button><button class="tab" data-view="sync">同步</button></nav>
      <section id="view"></section>
      <p class="hint">未設定同步時，勾選與進度會留在目前裝置；設定後可與 Google Sheets 同步。</p>
    </main>
  </div>
  <script>
    const roles=[
      {id:'main',name:'貓又老師',sheetRole:'貓又老師(魔法師)',job:'魔法師',store:'金屬／礦石',detail:'金屬、礦石、錠、鍛造原料',rule:'可轉移生活材料請轉入此角色。',daily:['每日任務','週幾地下城','兼職：聖水／重要兼職','銀幣清理（狩獵場／地下城）','每日限購／免費商品檢查','黑色坑洞：每日保底','魔族供品清理→深層地下城'],weekly:[['不詳的召喚結界',7],['黑色坑洞',14],['野外首領週戰利品',3],['每週任務',1],['生活材料商店：本週採購',1],['魔物討伐證明週商店／交換',1],['深淵通關戰利品',3],['週末深淵活動',3]]},
      {id:'z',name:'貓又老師z',sheetRole:'貓又老師z(電擊術士)',job:'電擊術士',store:'草藥／藥劑',detail:'藥草、蘑菇、花粉、濃縮液',rule:'所有藥劑素材集中此處。',daily:['每日任務','週幾地下城','兼職：聖水／重要兼職','銀幣清理（狩獵場／地下城）','每日限購／免費商品檢查','黑色坑洞：每日保底'],weekly:[['不詳的召喚結界',7],['黑色坑洞',14],['野外首領週戰利品',3],['每週任務',1],['生活材料商店：本週採購',1],['魔物討伐證明週商店／交換',1]]},
      {id:'zz',name:'貓又老師zz',sheetRole:'貓又老師zz(長弓兵)',job:'長弓兵',store:'木材／皮革',detail:'木材、樹液、皮革、纖維',rule:'採集與製作原料集中此處。'},
      {id:'o',name:'貓又老師o',sheetRole:'貓又老師o(樂師)',job:'樂師',store:'料理食材',detail:'肉、鹽、糖、油、蔬果、料理成品',rule:'雜貨店料理材料轉入此處。'},
      {id:'p',name:'貓又老師p',sheetRole:'貓又老師p(祭司)',job:'祭司',store:'布料／染料',detail:'羊毛、線、布料、染料、裁縫副料',rule:'紡織與外觀材料集中此處。'},
      {id:'oo',name:'貓又老師oo',sheetRole:'貓又老師oo(修道士)',job:'修道士',store:'彈性／活動材料',detail:'活動材料、可交易製作材料、待分類物品',rule:'每週整理一次；不要把寶石、符文放進這裡。'}
    ];
    const baseDaily=['每日任務','週幾地下城','兼職：聖水／重要兼職','銀幣清理（狩獵場／地下城）','每日限購／免費商品檢查','黑色坑洞：每日保底'];
    const baseWeekly=[['不詳的召喚結界',7],['黑色坑洞',14],['野外首領週戰利品',3],['每週任務',1],['生活材料商店：本週採購',1],['魔物討伐證明週商店／交換',1]];
    roles.forEach(r=>{r.daily??=baseDaily;r.weekly??=baseWeekly});
    let active='main',view='daily'; const key='mabi-mobile-web-demo-v1'; const state=JSON.parse(localStorage.getItem(key)||'{}');
    const syncKey='mabi-mobile-sync-v1'; const syncConfig=JSON.parse(localStorage.getItem(syncKey)||'{}'); let syncStatus='尚未設定同步';
    const save=()=>localStorage.setItem(key,JSON.stringify(state)); const get=(k,d)=>state[k]??d; const set=(k,v)=>{state[k]=v;save();render()};
    function syncReady(){return Boolean(syncConfig.url&&syncConfig.token)}
    function jsonp(params){return new Promise((resolve,reject)=>{if(!syncReady())return reject(new Error('請先填入同步網址與密鑰'));const cb='mabiSync_'+Date.now()+'_'+Math.random().toString(36).slice(2);const script=document.createElement('script');const url=new URL(syncConfig.url);Object.entries({...params,callback:cb,token:syncConfig.token}).forEach(([k,v])=>url.searchParams.set(k,String(v)));let timer;const cleanup=()=>{clearTimeout(timer);delete window[cb];script.remove()};window[cb]=data=>{cleanup();resolve(data)};script.onerror=()=>{cleanup();reject(new Error('無法連線到 Apps Script'))};script.src=url.toString();document.body.appendChild(script);timer=setTimeout(()=>{cleanup();reject(new Error('同步逾時'))},12000)})}
    async function syncRead(){if(!syncReady()){syncStatus='請先儲存同步網址與密鑰';render();return}syncStatus='讀取 Google Sheets 中…';render();try{const result=await jsonp({action:'read'});if(!result.ok)throw new Error(result.error||'讀取失敗');result.items.forEach(item=>{const r=roles.find(x=>x.sheetRole===item.role);if(!r)return;if(item.cycle==='每日'){const i=r.daily.indexOf(item.task);if(i>=0)state[`${r.id}-d-${i}`]=Boolean(item.complete)}else{const i=r.weekly.findIndex(([name])=>name===item.task);if(i>=0)state[`${r.id}-w-${i}`]=Number(item.progress||0)}});save();syncStatus=`已同步：${result.items.length} 筆（${result.gameDate}）`;render()}catch(err){syncStatus='同步失敗：'+err.message;render()}}
    async function syncWrite(r,task,cycle,progress,target){if(!syncReady())return;try{await jsonp({action:'save',role:r.sheetRole,task,cycle,progress,target});syncStatus='已同步至 Google Sheets';if(view==='sync')render()}catch(err){syncStatus='寫入失敗：'+err.message;if(view==='sync')render()}}
    function gameDate(){const n=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Taipei'}));if(n.getHours()<6)n.setDate(n.getDate()-1);return n.toLocaleDateString('zh-TW',{month:'numeric',day:'numeric',weekday:'short'})}
    document.querySelector('#date').textContent='遊戲日 '+gameDate();
    function progress(){const r=roles.find(x=>x.id===active);if(view==='daily'){const done=r.daily.filter((_,i)=>get(`${active}-d-${i}`,false)).length;return [done,r.daily.length]} const done=r.weekly.filter(([,target],i)=>get(`${active}-w-${i}`,0)>=target).length;return [done,r.weekly.length]}
    function render(){const r=roles.find(x=>x.id===active);document.querySelector('#rolebar').innerHTML=roles.map(x=>`<button class="role ${x.id===active?'active':''}" data-role="${x.id}">${x.name}</button>`).join('');
      document.querySelector('#identity').innerHTML=`<strong>${r.name} <span style="color:#607487;font-weight:500">｜${r.job}</span></strong><p>倉庫分工：<b>${r.store}</b>　${r.rule}</p>`;
      document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===view)); const [done,total]=progress();document.querySelector('#meter-title').textContent=view==='daily'?'今日完成度':view==='weekly'?'本週完成度':view==='storage'?'倉庫分工':'同步狀態';document.querySelector('#meter-label').textContent=view==='storage'?'6 角色已配置':view==='sync'?syncStatus:`${done} / ${total}`;document.querySelector('#meter-fill').style.width=view==='storage'?'100%':view==='sync'?(syncReady()?'100%':'0%'):`${total?done/total*100:0}%`;
      const root=document.querySelector('#view');
      if(view==='daily')root.innerHTML=`<div class="section-title"><h2>今日待辦</h2><small>06:00 重置</small></div><div class="card">${r.daily.map((t,i)=>`<label class="task ${get(`${active}-d-${i}`,false)?'done':''}"><input type="checkbox" ${get(`${active}-d-${i}`,false)?'checked':''} data-d="${i}"><span><span class="task-name">${t}</span><span class="task-note">${t.includes('坑洞')?'每日保底':'角色個別計算'}</span></span><span class="pill">每日</span></label>`).join('')}</div>`;
      if(view==='weekly')root.innerHTML=`<div class="section-title"><h2>本週待辦</h2><small>週一 06:00 重置</small></div><div class="card">${r.weekly.map(([t,target],i)=>{const v=Math.min(get(`${active}-w-${i}`,0),target);return `<div class="week ${v>=target?'complete':''}"><div><div class="week-name">${t}</div><small>${v>=target?'已完成':'尚未達標'} · ${v} / ${target}</small></div><div class="stepper"><button aria-label="減少 ${t}" data-step="${i}" data-delta="-1">−</button><output>${v}</output><button aria-label="增加 ${t}" data-step="${i}" data-delta="1">＋</button></div><progress value="${v}" max="${target}"></progress></div>`}).join('')}</div>`;
      if(view==='storage')root.innerHTML=`<div class="warehouse"><div class="warehouse-icon">▣</div><div><h2>${r.store} 倉</h2><p>${r.detail}</p></div><div class="rule">${r.rule} 寶石、符文等角色個人資源，留在取得角色身上。</div></div><div class="warehouse-list">${roles.map(x=>`<div><b>${x.name}｜${x.store}</b><span>${x.detail}</span></div>`).join('')}</div>`;
      if(view==='sync')root.innerHTML=`<div class="sync-panel"><h2>Google Sheets 同步</h2><p>先在同一份試算表建立 Apps Script 網頁應用程式，再把網址與密鑰填在這裡。設定只保存在此瀏覽器，不會寫入 GitHub。</p><label for="sync-url">Apps Script 網頁應用程式網址（/exec）</label><input id="sync-url" type="url" placeholder="https://script.google.com/macros/s/.../exec" value="${syncConfig.url||''}"><label for="sync-token">同步密鑰</label><input id="sync-token" type="password" placeholder="建立 Apps Script 時設定的密鑰" value="${syncConfig.token||''}"><div class="sync-actions"><button class="primary" data-sync-save>儲存設定</button><button data-sync-read>從 Google Sheets 讀取</button></div><div class="sync-status">${syncStatus}</div><ol class="sync-steps"><li>在 Google Sheet 開啟「擴充功能 → Apps Script」，貼上 GitHub 裡的 <b>Code.gs</b>。</li><li>執行 <b>setSyncToken()</b> 設定密鑰，再部署成網頁應用程式。</li><li>每台裝置填入同一組網址與密鑰；勾選或調整進度後會同步。</li></ol></div>`;
      document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{active=b.dataset.role;render()});document.querySelectorAll('[data-d]').forEach(c=>c.onchange=()=>{const r=roles.find(x=>x.id===active);const task=r.daily[Number(c.dataset.d)];set(`${active}-d-${c.dataset.d}`,c.checked);syncWrite(r,task,'每日',c.checked?1:0,1)});document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.step),target=r.weekly[i][1],old=get(`${active}-w-${i}`,0),next=Math.max(0,Math.min(target,old+Number(b.dataset.delta)));set(`${active}-w-${i}`,next);syncWrite(r,r.weekly[i][0],'每週',next,target)});document.querySelector('[data-sync-save]')?.addEventListener('click',()=>{syncConfig.url=document.querySelector('#sync-url').value.trim();syncConfig.token=document.querySelector('#sync-token').value.trim();localStorage.setItem(syncKey,JSON.stringify(syncConfig));syncStatus=syncReady()?'同步設定已儲存':'請完整填入網址與密鑰';render()});document.querySelector('[data-sync-read]')?.addEventListener('click',syncRead);
    }
    document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});render();
  </script>
</body>
</html>
