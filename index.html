<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102d45"><title>瑪奇 Mobile｜日週清單</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23102d45'/%3E%3Cpath d='M18 34l9 9 19-22' fill='none' stroke='%23dcecff' stroke-width='7'/%3E%3C/svg%3E"><style>
*{box-sizing:border-box}body{margin:0;background:#eaf2f8;color:#173044;font:16px/1.45 system-ui,-apple-system,"Microsoft JhengHei",sans-serif}.app{max-width:760px;min-height:100vh;margin:auto;background:#f8fbfd}header{background:#102d45;color:#fff;padding:20px 18px 16px}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}h1{font-size:20px;margin:0}.sub,.date{color:#c6dbe9;font-size:13px;margin:4px 0 0}.date{white-space:nowrap}.roles{display:flex;gap:8px;overflow:auto;background:#fff;padding:12px 14px;border-bottom:1px solid #d6e3ed}.role,.tab{border:1px solid #d5e3ed;background:#fff;border-radius:999px;padding:8px 12px;white-space:nowrap;color:#4b677a;font-weight:650;cursor:pointer}.role.on{background:#1e5d8f;border-color:#1e5d8f;color:#fff}main{padding:16px}.info{background:#e6f2fb;border:1px solid #cde0ee;padding:12px;border-radius:14px;font-size:14px}.info b{font-size:16px}.info p{margin:3px 0 0;color:#36556a}.meter{margin:12px 0;padding:12px;background:#fff;border:1px solid #d6e3ed;border-radius:14px;display:grid;grid-template-columns:1fr auto;gap:8px;font-size:14px}.bar{grid-column:1/-1;height:7px;background:#e5eef4;border-radius:9px;overflow:hidden}.fill{height:100%;background:#2780bb;transition:.2s}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:5px;background:#e3edf3;border-radius:13px;margin-bottom:14px}.tab{border:0;border-radius:9px;padding:9px}.tab.on{background:#fff;color:#102d45;box-shadow:0 1px 4px #18314522}.head{display:flex;justify-content:space-between;align-items:center;margin:8px 0}.head h2{font-size:16px;margin:0}.head small{color:#607487}.card,.warehouse{background:#fff;border:1px solid #d6e3ed;border-radius:14px;overflow:hidden}.task{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:12px;border-bottom:1px solid #e8eff4;min-height:58px}.task:last-child,.week:last-child{border:0}.task.done .name{text-decoration:line-through;color:#8495a1}.name{font-weight:700;font-size:15px}.note{font-size:12px;color:#637789}.tag{font-size:12px;background:#edf5fa;color:#47677d;padding:3px 7px;border-radius:99px}.task input{width:19px;height:19px;accent-color:#257ab2}.week{padding:12px;border-bottom:1px solid #e8eff4;display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center}.week.complete{background:#ecf7f0}.week.complete .name{color:#176043}.step{display:flex;border:1px solid #cadbe6;border-radius:9px;overflow:hidden}.step button{border:0;background:#edf5fa;color:#285f82;font-weight:800;width:32px;height:32px;cursor:pointer}.step output{min-width:38px;text-align:center;padding-top:5px;font-weight:800}.week progress{grid-column:1/-1;width:100%;accent-color:#2580b9}.warehouse{padding:15px}.warehouse h2{font-size:17px;margin:0}.warehouse p{margin:4px 0;color:#476477;font-size:14px}.rule{background:#fff3d4;color:#805400;padding:10px;border-radius:9px;margin-top:12px;font-size:13px}.list{margin-top:12px}.list div{padding:11px;border-bottom:1px solid #e8eff4}.list div:last-child{border:0}.list b{display:block}.list span{font-size:13px;color:#617687}.hint{text-align:center;color:#738594;font-size:12px;margin:16px 0 2px}@media(min-width:700px){main{padding:22px 30px}.roles{padding-left:30px}.roles::-webkit-scrollbar{display:none}}
</style></head><body><div class="app"><header><div class="top"><div><h1>瑪奇 Mobile｜日週清單</h1><p class="sub">六角色 · 日週任務 · 材料倉庫分工</p></div><p class="date" id="date"></p></div></header><nav class="roles" id="roles" aria-label="角色"></nav><main><section class="info" id="info"></section><section class="meter"><b id="meterTitle">今日完成度</b><span id="count"></span><div class="bar"><div class="fill" id="fill"></div></div></section><nav class="tabs"><button class="tab on" data-v="daily">今日</button><button class="tab" data-v="weekly">本週</button><button class="tab" data-v="storage">倉庫</button></nav><section id="content"></section><p class="hint">展示版：勾選與進度會記在這台裝置。</p></main></div><script>
const daily=['每日任務','週幾地下城','兼職：聖水／重要兼職','銀幣清理（狩獵場／地下城）','每日限購／免費商品檢查','黑色坑洞：每日保底'];const weekly=[['不詳的召喚結界',7],['黑色坑洞',14],['野外首領週戰利品',3],['每週任務',1],['生活材料商店：本週採購',1],['魔物討伐證明週商店／交換',1]];const roles=[['main','貓又老師','魔法師','金屬／礦石','金屬、礦石、錠、鍛造原料','可轉移生活材料請轉入此角色。'],['z','貓又老師z','電擊術士','草藥／藥劑','藥草、蘑菇、花粉、濃縮液','所有藥劑素材集中此處。'],['zz','貓又老師zz','長弓兵','木材／皮革','木材、樹液、皮革、纖維','採集與製作原料集中此處。'],['o','貓又老師o','樂師','料理食材','肉、鹽、糖、油、蔬果、料理成品','雜貨店料理材料轉入此處。'],['p','貓又老師p','祭司','布料／染料','羊毛、線、布料、染料、裁縫副料','紡織與外觀材料集中此處。'],['oo','貓又老師oo','修道士','彈性／活動材料','活動材料、可交易製作材料、待分類物品','每週整理一次；寶石、符文不轉倉。']];let a='main',v='daily',s=JSON.parse(localStorage.mabiDemo||'{}');const g=(k,d)=>s[k]??d,put=(k,x)=>{s[k]=x;localStorage.mabiDemo=JSON.stringify(s);render()};function render(){const r=roles.find(x=>x[0]==a);rolesEl.innerHTML=roles.map(x=>`<button class="role ${x[0]==a?'on':''}" data-r="${x[0]}">${x[1]}</button>`).join('');info.innerHTML=`<b>${r[1]} <span style="font-weight:400;color:#607487">｜${r[2]}</span></b><p>倉庫分工：<strong>${r[3]}</strong>　${r[5]}</p>`;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.v==v));let done=0,total=0;if(v==='daily'){total=daily.length;done=daily.filter((_,i)=>g(a+'d'+i,false)).length}if(v==='weekly'){total=weekly.length;done=weekly.filter((x,i)=>g(a+'w'+i,0)>=x[1]).length}meterTitle.textContent=v==='weekly'?'本週完成度':v==='storage'?'倉庫分工':'今日完成度';count.textContent=v==='storage'?'6 角色已配置':done+' / '+total;fill.style.width=v==='storage'?'100%':(total?done/total*100:0)+'%';if(v==='daily')content.innerHTML=`<div class="head"><h2>今日待辦</h2><small>每日 06:00 重置</small></div><div class="card">${daily.map((t,i)=>`<label class="task ${g(a+'d'+i,false)?'done':''}"><input type="checkbox" data-d="${i}" ${g(a+'d'+i,false)?'checked':''}><span><span class="name">${t}</span><br><span class="note">${t.includes('坑洞')?'每日保底':'角色個別計算'}</span></span><span class="tag">每日</span></label>`).join('')}</div>`;if(v==='weekly')content.innerHTML=`<div class="head"><h2>本週待辦</h2><small>週一 06:00 重置</small></div><div class="card">${weekly.map(([t,m],i)=>{let n=Math.min(g(a+'w'+i,0),m);return `<div class="week ${n>=m?'complete':''}"><div><span class="name">${t}</span><br><span class="note">${n>=m?'已完成':'尚未達標'} · ${n} / ${m}</span></div><div class="step"><button data-i="${i}" data-x="-1">−</button><output>${n}</output><button data-i="${i}" data-x="1">＋</button></div><progress value="${n}" max="${m}"></progress></div>`}).join('')}</div>`;if(v==='storage')content.innerHTML=`<div class="warehouse"><h2>${r[3]} 倉</h2><p>${r[4]}</p><div class="rule">${r[5]} 寶石、符文等角色個人資源，留在取得角色身上。</div></div><div class="card list">${roles.map(x=>`<div><b>${x[1]}｜${x[3]}</b><span>${x[4]}</span></div>`).join('')}</div>`;document.querySelectorAll('[data-r]').forEach(x=>x.onclick=()=>{a=x.dataset.r;render()});document.querySelectorAll('[data-d]').forEach(x=>x.onchange=()=>put(a+'d'+x.dataset.d,x.checked));document.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{let i=x.dataset.i,m=weekly[i][1];put(a+'w'+i,Math.max(0,Math.min(m,g(a+'w'+i,0)+ +x.dataset.x)))});}const rolesEl=document.querySelector('#roles'),info=document.querySelector('#info'),content=document.querySelector('#content'),meterTitle=document.querySelector('#meterTitle'),count=document.querySelector('#count'),fill=document.querySelector('#fill');document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{v=x.dataset.v;render()});let d=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Taipei'}));if(d.getHours()<6)d.setDate(d.getDate()-1);document.querySelector('#date').textContent='遊戲日 '+d.toLocaleDateString('zh-TW',{month:'numeric',day:'numeric',weekday:'short'});render();
</script></body></html>
